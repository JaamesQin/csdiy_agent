units:
  - unit_id: lecture-01
    order: 1
    title: Introduction to Deep Learning
    description: "人工整理：介绍深度学习与可微编程的基本定义、神经网络发展脉络，以及课程后续涉及的模型、训练和应用版图。"
    description_status: manually_curated_from_slides
    prerequisites:
      - gradient descent
      - multilayer perceptrons and ReLU nonlinearities
      - softmax and cross-entropy loss
      - tensors and basic parallel processing concepts
    prerequisites_status: manually_curated_from_slides
    inherits_coursepilot_prerequisites: true
    core_demo: false
