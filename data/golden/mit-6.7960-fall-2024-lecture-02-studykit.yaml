    objective: "区分梯度下降、随机梯度下降和反向传播各自解决的问题。"
    evidence_required: "能够分别说明梯度的计算、参数的更新以及批次（batch）对梯度估计的影响。"
  - id: obj-02
    objective: "把多层神经网络表示为由可微节点组成的计算图。"
    evidence_required: "能够标出输入、参数、中间激活、输出和标量损失。"
  - id: obj-03
    objective: "使用链式法则解释梯度如何从损失沿计算图反向传播。"
    evidence_required: "能够为链式计算和带分支的 DAG 写出局部梯度组合关系。"
  - id: obj-04
    objective: "描述一次完整训练迭代中的前向传播、反向传播和参数更新。"
    evidence_required: "能够按正确顺序给出三个阶段，并说明每一阶段产生的数据。"
  - id: obj-05
    objective: "解释可微编程如何把模块化程序与基于梯度的优化连接起来。"
    evidence_required: "能够指出可微节点、标量目标和可优化变量三项条件。"

