learning_objectives:
  - id: obj-01
    objective: "解释 token 如何把输入数据组织为可操作的向量表示。"
    evidence_required: "能够说明 token 的 code vector、token 矩阵 T 的形状，以及 tokenization 如何把输入映射为 token。"
  - id: obj-02
    objective: "区分固定参数的 token mixing 与数据依赖的 attention mixing。"
    evidence_required: "能够解释 W 与 attention matrix A 的区别，并写出加权组合的基本形式。"
  - id: obj-03
    objective: "用 query、key、value 解释 self-attention 的计算路径。"
    evidence_required: "能够写出 Q、K、V、A 和 Z_out 的形状关系，并说明 softmax 权重如何产生。"
  - id: obj-04
    objective: "描述 multihead self-attention 和 Transformer block 的组成。"
    evidence_required: "能够说明多个 attention head 如何并行、合并，以及 token-wise MLP、normalization 和 residual connection 的位置。"
  - id: obj-05
    objective: "解释 permutation equivariance、位置编码和 autoregressive mask 的关系。"
    evidence_required: "能够区分置换等变与置换不变，并说明位置编码或 causal mask 解决什么问题。"
  - id: obj-06
    objective: "识别 self-attention、causal self-attention 和 cross-attention 的应用差异。"
    evidence_required: "能够指出 query、key、value 分别来自哪些 token 集合，以及图像到文本架构中 cross-attention 的作用。"

