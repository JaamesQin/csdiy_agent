glossary:
- term: Data++
  translation: 增强数据对象
  definition: 包含样本、潜变量、生成/逆映射及操作的数据接口抽象。
- term: counterfactual
  translation: 反事实
  definition: 控制某些因素变化时询问输出如何改变。
- term: inner loop
  translation: 任务内循环
  definition: 在单个任务上少量更新以快速适应。
- term: outer loop
  translation: 元更新循环
  definition: 依据多个任务适应后的损失更新共享初始化。
- term: meta-learning
  translation: 元学习
  definition: 学习如何快速形成任务特定行为。
common_misconceptions:
- misconception: Data++ 写了 G⁻¹ 就说明所有生成器可精确反演。
  correction: 它是接口抽象，存在性、唯一性和可算性需验证。
- misconception: 一张 GAN 标注图普遍等价于一百张真实图。
  correction: 仅为第26页特定实验摘要。
- misconception: 潜方向改变证明真实因果因素。
  correction: 它只产生模型内反事实候选。
- misconception: MAML 只是普通微调。
  correction: 初始化由多任务适应后损失穿过更新过程来学习。
