core_concepts:
- id: cc-01
  term: token 与 N×d 矩阵
  claim_type: source_summary
  explanation: 课件把 token 定义为神经元向量，并用 N 行、每行 d 维的矩阵组织一组 token。图像可以先分块，再把每个块投影成一个 token；这里仅保留课件可见的抽象步骤，不复刻示例图像细节。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 11
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 14
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 16
  formula:
    status: resolved
    latex: T_{\mathrm{in}}\in\mathbb{R}^{N\times d}
    citation:
      source_id: mit6-7960-f24-lec8-e72290651c
      anchor:
        type: page
        value: 16
    warnings:
    - 公式仅采用第 16 页渲染中可见并经逐页审计的 N×d 记号。
- id: cc-02
  term: 跨 token 线性混合
  claim_type: source_summary
  explanation: 输出的第 i 个 token 是所有输入 token 的加权和；把权重 w_ij 排成矩阵 W 后，混合写成左乘 WT_in。这个操作改变
    token 之间的信息组合，而不把通道维 d 当作被求和的 token 轴。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 17
  formula:
    status: resolved
    latex: T_{\mathrm{out}}[i,:]=\sum_{j=1}^{N}w_{ij}T_{\mathrm{in}}[j,:],\quad T_{\mathrm{out}}=WT_{\mathrm{in}}
    citation:
      source_id: mit6-7960-f24-lec8-e72290651c
      anchor:
        type: page
        value: 17
    warnings: []
- id: cc-03
  term: 共享逐 token 非线性
  claim_type: source_summary
  explanation: 同一个函数 F_θ 独立地应用到每一行 token。它与跨 token 混合互补：前者逐 token 修改表示，后者在 token 之间交换信息。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 18
  formula:
    status: resolved
    latex: T_{\mathrm{out}}=\begin{bmatrix}F_\theta(T_{\mathrm{in}}[0,:])\\\vdots\\F_\theta(T_{\mathrm{in}}[N-1,:])\end{bmatrix}
    citation:
      source_id: mit6-7960-f24-lec8-e72290651c
      anchor:
        type: page
        value: 18
    warnings:
    - 保留渲染页可见的 0 到 N−1 行索引。
- id: cc-04
  term: 由数据生成的注意力权重
  claim_type: source_summary
  explanation: Transformer 可从全连接 token 图的视角理解；注意力不使用固定的 token 混合矩阵，而是根据当前输入生成连接权重。由此，混合模式可随输入改变。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 24
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 26
- id: cc-05
  term: Q/K/V 与缩放点积自注意力
  claim_type: source_summary
  explanation: 同一 token 矩阵 T 分别线性投影为 query、key 和 value。QKᵀ 产生 token 两两之间的分数，除以 √m
    后按课件公式做 softmax 得到 A，再由 AV 汇聚 value。这里沿用已审计公式，不把第 39 页示意代码的轴写法扩展为通用实现规范。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 34
  formula:
    status: resolved
    latex: Q=T W_q^\top,\ K=T W_k^\top,\ V=T W_v^\top,\ A=\operatorname{softmax}\!\left(\frac{QK^\top}{\sqrt
      m}\right),\ T_{\mathrm{out}}=AV
    citation:
      source_id: mit6-7960-f24-lec8-e72290651c
      anchor:
        type: page
        value: 34
    warnings:
    - softmax 轴不从未保留的示意代码外推。
- id: cc-06
  term: 多头自注意力
  claim_type: source_summary
  explanation: k 个注意力头并行处理同一输入，各自得到输出；这些输出先拼接为中间表示，再乘 W_MSA 投影。候选稿不补造课件未显示的具体头数或额外维度。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 37
  formula:
    status: resolved
    latex: T_{\mathrm{out}}^{i}=\operatorname{attn}^{i}(T_{\mathrm{in}}),\ i\in\{1,\ldots,k\};\quad
      T_{\mathrm{out}}=\bar T_{\mathrm{out}}W_{\mathrm{MSA}}
    citation:
      source_id: mit6-7960-f24-lec8-e72290651c
      anchor:
        type: page
        value: 37
    warnings:
    - 仅保留渲染页可见的并行、拼接与输出投影关系。
- id: cc-07
  term: Transformer/ViT 块
  claim_type: source_summary
  explanation: 课件的 ViT 块把多头自注意力、token norm、逐 token MLP 和残差连接组织成可重复的块。学习时应分别标注跨 token
    的注意力路径与逐 token 的 MLP 路径，而不从结构示意补造训练目标。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 38
- id: cc-08
  term: 置换等变性
  claim_type: source_summary
  explanation: 如果先置换 token 再经过 Transformer，结果等于先经过 Transformer 再对输出做同样置换。这是等变性：输出会随输入一同重排，并不是所有排列都产生同一个不变输出。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 35
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 41
  formula:
    status: resolved
    latex: \operatorname{transformer}(\operatorname{permute}(T))=\operatorname{permute}(\operatorname{transformer}(T))
    citation:
      source_id: mit6-7960-f24-lec8-e72290651c
      anchor:
        type: page
        value: 41
    warnings:
    - 公式表达置换等变性，不得改写成置换不变性。
- id: cc-09
  term: 位置编码
  claim_type: source_summary
  explanation: 当任务需要 token 的位置或顺序时，可向 token 加入位置信息，以打破纯内容处理无法区分位置的局限。课件展示 Fourier
    位置码作为一种示例，但并未把它规定为唯一方案。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 43
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 44
- id: cc-10
  term: 自回归、因果注意力与跨注意力
  claim_type: source_summary
  explanation: 自回归模型按已有前缀预测下一个 token；训练时的因果注意力掩码阻止位置读取未来 token，多层堆叠仍须保持这一时间方向。课件还以已标注的图像编码器、自动回归文本解码器和跨注意力说明跨模态模块之间的数据流；这里只保留这些模块关系。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 48
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 51
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 52
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 54
glossary:
- term: token
  definition: 作为一个整体被 Transformer 操作的神经元向量。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 11
- term: token mixing
  definition: 用权重矩阵在 token 轴上形成输入 token 的线性组合。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 17
- term: query / key / value
  definition: 由 token 矩阵的三组线性投影得到，用于计算注意力分数与汇聚内容。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 34
- term: self-attention
  definition: Q、K、V 都由同一组输入 token 产生的注意力。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 34
- term: multi-head self-attention
  definition: 并行运行多个注意力头，拼接结果后再做输出投影。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 37
- term: 置换等变性
  definition: 输入 token 的置换会在输出端产生同样的置换。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 41
- term: 位置编码
  definition: 加入 token 的位置信息，使模型能够使用顺序或空间位置。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 43
- term: 因果注意力
  definition: 限制每个位置只能利用当前及先前位置信息的注意力模式。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 51
- term: 跨注意力
  definition: 在课件的图文架构示例中连接图像编码表示与文本解码过程的注意力模块。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 54
common_misconceptions:
- misconception: token 就是一个标量神经元。
  correction: 课件把 token 定义为神经元向量；一组 token 用 N×d 矩阵表示。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 11
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 16
- misconception: 注意力只是一个训练后固定不变的混合矩阵。
  correction: 课件强调注意力权重由当前数据生成；QKᵀ 经缩放和 softmax 形成 A。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 26
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 34
- misconception: 置换等变意味着置换输入后输出完全不变。
  correction: 等变关系要求输出跟随输入做同样置换；这不同于输出不随置换变化的不变性。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 41
- misconception: Fourier 编码是课件规定的唯一位置编码。
  correction: 课件用它作位置码示例；已审计证据不支持唯一性结论。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 43
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 44
- misconception: 训练自回归模型时每个位置可以读取完整目标序列。
  correction: 因果掩码用于阻止未来信息泄漏，而且多层堆叠仍要保持时间方向。
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 51
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 52
