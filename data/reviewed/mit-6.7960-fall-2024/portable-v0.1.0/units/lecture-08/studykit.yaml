- id: p-02
  level: 基础计算
  question: 给定一个 3×d 的 token 矩阵和自选的 2×3 权重矩阵 W，逐行计算 WT_in，并解释求和发生在哪个轴；再写出逐 token 函数
    F_θ 的输出形式。
  hint: 把 W 的一行当作对三个输入 token 的权重；F_θ 则对每一行独立复用。
  deliverable: 矩阵乘法、两个输出 token 和一段两类操作的比较。
  expected_evidence:
  - W 的列数等于输入 token 数
  - 输出为 2×d
  - 求和沿 token 轴
  - F_θ 在各行共享
  evaluation:
    criteria:
    - 形状相容
    - 线性混合与逐 token 变换未混淆
    - 计算可复核
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
