learning_objectives:
- id: lo-01
  objective: 把输入表示为 N×d 的 token 矩阵，并解释 token 与标量神经元表示的区别。
- id: lo-02
  objective: 分别写出跨 token 线性混合与共享逐 token 非线性，辨认两者作用的轴。
- id: lo-03
  objective: 从 token 矩阵推导 Q、K、V、缩放点积注意力矩阵及输出的形状。
- id: lo-04
  objective: 说明多头注意力如何并行、拼接和投影，并读懂 Transformer/ViT 块中的归一化、MLP 与残差。
- id: lo-05
  objective: 准确区分置换等变性与置换不变性，并用等式检验 Transformer 的置换行为。
- id: lo-06
  objective: 从置换等变性说明加入位置信息的必要性，并把 Fourier 编码视为课件给出的一个示例。
- id: lo-07
  objective: 解释自回归下一 token 预测中因果掩码的作用，并审计多层网络是否保持时间方向。
- id: lo-08
  objective: 沿已审计的模块标签说明图像编码器、文本解码器与跨注意力之间的数据流。
