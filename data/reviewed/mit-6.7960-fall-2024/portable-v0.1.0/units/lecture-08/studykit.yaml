- id: p-05
  level: 核心辨析
  question: 选择三个 token 和一个非平凡置换 P，用符号写出 Transformer(P(T)) 与 P(Transformer(T)) 的对应关系；再构造一句错误的“不变性”表述并纠正它。
  hint: 等变要求输出顺序随输入一起变；不变则要求输出完全相同。
  deliverable: 一个置换示例、一条等变等式和一组错误—纠正对照。
  expected_evidence:
  - 输入与输出使用同一置换
