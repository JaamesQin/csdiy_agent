practice:
- id: p-01
  level: 基础
  question: 设有 N 个 token、每个 token 含 d 个通道。写出输入矩阵的形状，标出一行和一列各代表什么，并说明图像分块后怎样进入这个表示。
  hint: 先固定“行是 token、列是通道”，只描述分块与投影的抽象流程。
  deliverable: 一张带行列标签的 N×d 矩阵草图和三句说明。
  expected_evidence:
  - N 对应 token 数
  - d 对应每个 token 的维度
  - 分块后投影为 token
  - 不复刻示例图像细节
  evaluation:
    criteria:
    - 矩阵方向正确
    - token 不被写成标量
    - 描述未超出可见抽象步骤
  citations:
