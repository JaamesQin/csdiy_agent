- id: p-03
  level: 核心推导
  question: 令 T 为 N×d，并为 W_q、W_k、W_v 自选与公式相容的投影形状。推导 Q、K、V、QKᵀ、A 和 AV 的形状，说明 A 的两个
    N 轴分别索引什么。
  hint: 先令 query/key 投影维数为 m；保证 Q 与 K 的内积维相同，再处理 value 维。
  deliverable: 一条完整形状链和对 A 行列语义的说明。
  expected_evidence:
  - QKᵀ 为 N×N
  - 缩放量为 √m
  - A 用于汇聚 V
  - 最终 token 数仍为 N
  evaluation:
    criteria:
    - 所有矩阵乘法相容
    - 没有从示意代码断言 softmax 通用轴
    - query/key/value 角色分明
  citations:
  - source_id: mit6-7960-f24-lec8-e72290651c
    anchor:
      type: page
      value: 34
- id: p-04
  level: 核心架构
  question: 画出 k 个注意力头处理同一 T_in 的数据流：分别标出并行输出、拼接结果和 W_MSA 投影；随后把该模块放进包含 token norm、MLP
    和残差的 ViT 块。
  hint: 先画单层的扇出—拼接—投影，再区分注意力路径和逐 token MLP 路径。
  deliverable: 一幅仅含模块与张量标签的架构图，以及每个模块的一句作用说明。
  expected_evidence:
