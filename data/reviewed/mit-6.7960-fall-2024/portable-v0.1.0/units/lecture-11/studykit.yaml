glossary:
- term: encoder
  definition: 把输入映射为特征向量的函数。
- term: finetuning
  definition: 用预训练参数初始化新任务并继续训练。
- term: vector quantization
  definition: 把连续数据映射到离散代码。
- term: pretext task
  definition: 从原始数据构造目标的自监督任务。
- term: imputation
  definition: 预测缺失数据。
common_misconceptions:
- misconception: 表示只存在于网络最终输出。
  correction: 中间层也形成表示。
- misconception: 自监督完全没有监督信号。
  correction: 它从数据自身构造目标。
- misconception: 掩码预测优势已有定论。
  correction: 课件明确称其原因仍是开放问题。
