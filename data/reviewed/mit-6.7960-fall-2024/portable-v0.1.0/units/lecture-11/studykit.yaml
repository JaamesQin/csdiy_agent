practice:
- id: p1
  level: 基础
  question: 写出输入、编码器、表示向量和下游分类器的数据流。
  hint: 编码器输出向量。
  deliverable: 箭头图与符号说明。
  expected_evidence:
  - 输入经编码器得到向量
  - 下游任务使用表示
  evaluation:
    full_credit: 数据流正确
    partial_credit: 术语不完整
  citations:
  - source_id: mit6-7960-f24-lec11-5c0ea53f8a
    anchor:
      type: page
      value: 22
- id: p2
  level: 应用
  question: 比较冻结编码器与端到端微调会更新哪些参数。
  hint: 考虑预训练参数是否继续变化。
  deliverable: 两列表格。
  expected_evidence:
  - 冻结只更新新头
  - 微调更新部分或全部预训练参数
  evaluation:
    full_credit: 边界清楚
    partial_credit: 只说明一种
  citations:
  - source_id: mit6-7960-f24-lec11-5c0ea53f8a
    anchor:
      type: page
      value: 29
- id: p3
  level: 分析
  question: 从五个评价维度检查一个表示，并举出一个维度间权衡。
  hint: 低维不必然充分。
  deliverable: 五行检查表。
  expected_evidence:
  - 五个维度
  - 至少一个权衡
  evaluation:
    full_credit: 维度和权衡合理
    partial_credit: 覆盖至少三个维度
  citations:
  - source_id: mit6-7960-f24-lec11-5c0ea53f8a
    anchor:
      type: page
      value: 31
- id: p4
  level: 分析
  question: 把自编码、k-means、未来预测、补全和预文本任务按压缩/预测分类。
  hint: 参考方法表。
  deliverable: 五行分类表。
  expected_evidence:
  - 分类正确
  - 解释两类目标
  evaluation:
    full_credit: 五项均正确
    partial_credit: 至少四项正确
  citations:
  - source_id: mit6-7960-f24-lec11-5c0ea53f8a
    anchor:
      type: page
      value: 35
- id: p5
  level: 综合
  question: 解释掩码预测可能优于普通自编码的三条课件假设，并说明证据边界。
  hint: 瓶颈、复制捷径、下游任务。
  deliverable: 三点加一条边界。
  expected_evidence:
  - 三条假设
  - 明确开放问题
  evaluation:
    full_credit: 假设和边界准确
    partial_credit: 列出两条假设
  citations:
  - source_id: mit6-7960-f24-lec11-5c0ea53f8a
    anchor:
      type: page
      value: 62
