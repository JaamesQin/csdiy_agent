glossary:
- term: domain randomization / data augmentation
  definition: 训练时随机扰动数据，使测试样本落入训练扰动覆盖范围。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 14
- term: sanity check
  definition: 用可计算的参考行为检查损失、模式或数据管线是否合理。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 49
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 56
- term: checkpoint
  definition: 保存训练状态以支持恢复、梯度累积或事后调试。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 52
- term: effective learning rate
  definition: 由显式学习率与梯度尺度共同决定的实际更新尺度。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 50
- term: leaf tensor
  definition: 直接创建、不是可微操作结果的计算图叶节点。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 64
common_misconceptions:
- misconception: 磁盘文件看起来正确就说明模型输入正确。
  correction: 预处理和 reshape 可能改变数据，必须检查实际传给模型的张量。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 7
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 12
- misconception: 训练损失迅速接近零总是好事。
  correction: 课件把它也视为问题可能过易的信号，需要结合目标难度判断。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 15
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 18
- misconception: 讲者的 2024 默认模型建议是普适定理。
  correction: 这些是带时间背景的实践建议，应由任务基线验证。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 41
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 42
- misconception: retain_graph=True 是所有二次 backward 报错的首选修复。
  correction: 课件提醒该错误常表示做了不想做的事，应先检查计算图设计。
