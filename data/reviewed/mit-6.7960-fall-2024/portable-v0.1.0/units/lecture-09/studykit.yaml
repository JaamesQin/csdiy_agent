review:
  generator_review_status: audited_draft
  audit_findings:
  - 72 页原 PDF 已通过逐页文本盘点；第9页标准化公式使用统一 page-image 视觉核对。
  - 所有工程建议均作为 2024 课程中的 source_summary，不提升为永久或普适最佳实践。
  - 第三方图像和图表细节未复刻，练习只使用抽象诊断情景。
  - 学习顺序合计 180 分钟，8 道练习覆盖数据、模型、优化、评估、调试与计算。
limitations:
- 本讲以实践启发式为主，不把经验建议表述为理论保证。
- 含第三方视觉材料的页面仅引用课件文字或抽象关系，不描述受限图像细节。
- 硬件、框架 API 与所谓“默认选择”具有时间敏感性；本 StudyKit 只复述 Fall 2024 课件语境。
- 第9页标准化公式未给出零方差维度、估计偏差或数据泄漏的完整处理；相关内容仅作为学习者检查项。
