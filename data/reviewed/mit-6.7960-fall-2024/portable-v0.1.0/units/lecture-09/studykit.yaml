practice:
- id: p1
  level: 基础检查
  question: 为一个批次张量设计 inspect_data 输出，并说明每个字段能排查哪类问题。
  hint: 至少覆盖类型、形状、requires_grad、范围、均值和方差。
  deliverable: 一张字段—故障对照表。
  expected_evidence:
  - 六类字段齐全
  - 区分磁盘数据与模型实际输入
  - 包含异常范围或形状诊断
  evaluation:
    criteria:
    - 覆盖完整
    - 诊断对应合理
    - 不泄露真实私有样本
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 7
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 8
- id: p2
  level: 基础计算
  question: 给定两个量纲差异很大的输入维，写出逐维标准化公式，并说明均值/方差应从哪一部分数据估计。
  hint: 防止测试信息进入训练预处理。
  deliverable: 公式、口径说明和一条数据泄漏警告。
  expected_evidence:
  - 逐维减均值除标准差
  - 使用训练集统计量
  - 指出零方差需单独处理
  evaluation:
    criteria:
    - 公式正确
    - 口径无泄漏
    - 限制明确
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 9
- id: p3
  level: 诊断
  question: 为三条训练曲线分别提出“数据过易、尚未拟合、困难但在学习”的诊断，并给出下一项最小实验。
  hint: 一次只改变一个因素。
  deliverable: 三行诊断表和三个最小实验。
  expected_evidence:
  - 诊断与第15页一致
  - 实验可区分原因
  - 不把启发式写成定理
  evaluation:
    criteria:
    - 证据边界
    - 可操作性
    - 变量控制
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
