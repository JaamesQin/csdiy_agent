core_concepts:
- id: c1
  term: 数据检查闭环
  claim_type: source_summary
  explanation: 先查看输入、输出和损失，再检查随机样本、目标分布、异常值与近邻。尤其要检查传给模型的张量，而不仅是磁盘上的数据；类型、形状、梯度标志、数值范围、均值和方差是最小诊断集合。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 4
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 5
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 6
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 7
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 8
- id: c2
  term: 按维标准化
  claim_type: source
  explanation: 对每个输入维度减去该维均值并除以标准差，使不同单位或尺度的维度进入相近范围。均值和方差应由训练数据口径确定，不能用测试集信息污染训练。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 9
  formula:
    status: resolved
    latex: x_k\leftarrow\frac{x_k-\mathbb{E}[x_k]}{\sqrt{\operatorname{Var}[x_k]}}\quad\forall
      k
    citation:
      source_id: mit6-7960-f24-lec9-132cf6994a
      anchor:
        type: page
        value: 9
    warnings:
    - 公式已由统一 page-image 视觉核对；课件未讨论零方差维度的工程处理。
- id: c3
  term: 数据增强与域随机化
  claim_type: source_summary
  explanation: 训练时对数据施加随机扰动，目标是让测试样本看起来像另一种训练扰动。它改变训练分布，必须检查扰动是否仍保持任务标签语义。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 14
- id: c4
  term: 训练曲线与问题难度
  claim_type: source_summary
  explanation: 课件把很快达到低损失视为数据可能过易，把始终不下降视为尚未拟合，把艰难但持续下降视为更理想的学习问题。该图是诊断启发式，不是任何任务都适用的判据。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 15
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 18
- id: c5
  term: 简单基线
  claim_type: source_summary
  explanation: 第一次实验应使用尽可能简单的模型，并分别在有/无新想法时运行，以便构建、调试、分享和归因。课件关于 cross-entropy、Adam、Transformer、layer
    norm 的建议标注为 2024 年默认选择，必须按任务和时间背景理解。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 26
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 40
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 41
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 42
- id: c6
  term: 优化调试阶梯
  claim_type: source_summary
  explanation: 先过拟合一个样本，再拟合一个批次，然后尝试整个或微型数据集；先确认训练集可拟合，再讨论测试集泛化。这个顺序把数据、模型和优化故障逐层隔离。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 48
- id: c7
  term: 参考损失 sanity check
  claim_type: source_summary
  explanation: 分类交叉熵可与均匀预测比较，例如二分类和十分类的对数概率基线；平方损失可与预测目标均值或零比较。损失恒定时还应检查零初始化等错误。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 49
- id: c8
  term: 学习率、批大小与迭代
  claim_type: source_summary
  explanation: 课件将学习率和批大小列为关键超参数，建议先用常数学习率、按 SGD 迭代而非 epoch 安排日程，并在模型变化后重新调学习率，因为梯度尺度可能改变。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 50
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 51
- id: c9
  term: 可恢复且可审计的训练
  claim_type: source_summary
  explanation: checkpoint 可在空间与时间之间取舍、积累梯度、崩溃后恢复，并留下调试轨迹；评估时应切换并核对 eval 模式，配置与日志应记录全部实验参数。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 52
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 56
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 59
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 62
- id: c10
  term: GPU 正确性先于扩展
  claim_type: source_summary
  explanation: 无梯度推理、GPU 同步计时、计算图生命周期和叶张量原地修改都会影响正确性或测量。并行化应从单设备到单机多设备再到多机，并检查每秒迭代是否真的改善。
  citations:
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 64
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
      type: page
      value: 65
  - source_id: mit6-7960-f24-lec9-132cf6994a
    anchor:
