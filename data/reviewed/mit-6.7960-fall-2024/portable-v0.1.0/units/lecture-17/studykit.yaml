core_concepts:
- id: c1
  term: 分布外泛化
  claim_type: source_summary
  explanation: 部署数据可能来自与训练不同的分布；扰动、标签比例、时间地点和测量来源变化均可造成偏移。
  citations:
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 5
- id: c2
  term: 投影梯度上升与对抗训练
  claim_type: source_summary
  explanation: 攻击迭代沿扰动梯度上升并投影回可行集合；对抗训练对每个样本先找集合内高损失扰动，再最小化相应训练损失。
  citations:
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 22
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 24
- id: c3
  term: 捷径特征
  claim_type: source_summary
  explanation: 捷径在训练数据中与标签相关，却在现实分布偏移下不保持该相关性，因此依赖它的模型可能失效。
  citations:
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 30
- id: c4
  term: 鲁棒表示与迁移观察
  claim_type: inference
  explanation: 所示视觉实验中，鲁棒模型的输入梯度更接近人可识别结构；多个迁移面板常见提升，但少数组合不占优，不能外推为普遍结论。
  citations:
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 37
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 38
- id: c5
  term: 分布鲁棒优化
  claim_type: explanation
  explanation: DRO 在经验分布邻域内选择使期望损失最大的候选分布，再优化模型。泛化说明依赖真实分布落入由距离和半径定义的邻域，因而不是任意分布外保证。
  citations:
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 50
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 51
glossary:
- term: OOD
  definition: out-of-distribution，部署分布不同于训练分布的情形。
- term: adversarial example
  definition: 在约束扰动下诱导模型产生目标行为或高损失的样本。
- term: projection
  definition: 把一次更新映射回允许的扰动集合。
- term: shortcut
  definition: 训练相关但在现实偏移下不稳定的特征。
- term: ambiguity set
  definition: DRO 中围绕经验分布构造的候选分布集合。
common_misconceptions:
- misconception: 同分布测试准确率高就保证部署可靠。
  correction: 真实部署可能改变输入、标签比例或数据生成机制。
- misconception: 对抗训练解决所有分布偏移。
  correction: 它直接覆盖的是所选扰动集合内的最坏情形。
- misconception: DRO 自动保证任意分布外泛化。
  correction: 保证取决于真实分布是否在所选歧义集合及其他建模条件内。
