practice:
- id: p1
  level: 基础
  question: 给出一个训练与部署分布不同的案例，并分别指出变的是输入、标签比例还是数据生成环境。
  hint: 可从天气、地点或测量来源入手。
  deliverable: 三列表格一行。
  expected_evidence:
  - 明确训练和部署场景
  - 正确标注至少一种偏移
  evaluation:
    full_credit: 场景、变化对象与风险一致
    partial_credit: 只描述场景但未定位变化
  citations:
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 5
- id: p2
  level: 应用
  question: 用文字解释投影梯度上升一次迭代的两个动作，以及为何必须投影。
  hint: 先沿梯度更新，再回到允许集合。
  deliverable: 两步算法加一句约束解释。
  expected_evidence:
  - 梯度上升方向
  - 投影回扰动集合
  evaluation:
    full_credit: 两个动作与目的均正确
    partial_credit: 遗漏投影目的
  citations:
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 22
- id: p3
  level: 分析
  question: 把对抗训练目标拆成内层与外层：各自优化什么变量、追求什么结果？
  hint: 扰动取最大，参数取最小。
  deliverable: 内外层对照表。
  expected_evidence:
  - 内层在扰动集内最大化损失
  - 外层最小化模型参数的最坏情形损失
  evaluation:
    full_credit: 变量、方向与含义均正确
    partial_credit: 方向正确但变量不清
  citations:
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 24
- id: p4
  level: 分析
  question: 在形状与位置都能预测标签的玩具数据中，设计一次能暴露位置捷径的分布外测试。
  hint: 打破位置和标签的相关性，同时保留形状语义。
  deliverable: 训练/测试构造和预期结果。
  expected_evidence:
  - 测试中打破捷径相关性
  - 保留目标相关特征
  - 说明模型失效如何暴露捷径
  evaluation:
    full_credit: 控制变量与诊断逻辑完整
    partial_credit: 只改变位置但未说明预期
  citations:
  - source_id: mit6-7960-f24-lec17-44d46a8cc8
    anchor:
      type: page
      value: 30
- id: p5
  level: 综合
  question: 为类别不平衡任务写一个 DRO 方案说明：候选分布如何产生、模型优化什么，并列出不能承诺的外推。
  hint: 可考虑对训练样本重加权；保证依赖邻域。
  deliverable: 方案三点加边界两点。
  expected_evidence:
  - 歧义集合围绕经验分布
  - 内层选高损失候选分布
  - 外层优化参数
  - 明确真实分布在邻域条件
  - 不承诺覆盖任意偏移
  evaluation:
    full_credit: 机制和两类边界完整
    partial_credit: 机制正确但遗漏条件
