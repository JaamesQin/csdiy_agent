glossary:
- term: AGGREGATE
  definition: 合并邻居表示的置换不变操作。
- term: UPDATE
  definition: 组合节点旧表示和邻域消息的操作。
- term: READOUT
  definition: 从节点表示集合得到图表示的操作。
- term: 1-WL
  definition: 利用邻居颜色多重集细化节点颜色的过程。
common_misconceptions:
- misconception: 节点重排后节点嵌入应完全不变。
  correction: 节点输出应等变，图输出才应不变。
- misconception: 任何不变聚合都同样有区分力。
  correction: 不同聚合会丢失不同的多重集信息。
