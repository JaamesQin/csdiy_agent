core_concepts:
- id: c1
  term: 图输入与预测层级
  claim_type: source_summary
  explanation: GNN 接收图结构与节点属性，输出可以面向节点、边或整个图。
  citations:
  - source_id: mit6-7960-f24-lec5-3b5ab40fdb
    anchor:
      type: page
      value: 10
- id: c2
  term: 置换不变性与等变性
  claim_type: source_summary
  explanation: 重新编号节点不应改变图级输出；节点级输出应以相同方式重新排列。
  citations:
  - source_id: mit6-7960-f24-lec5-3b5ab40fdb
    anchor:
      type: page
      value: 11
- id: c3
  term: 消息传递
  claim_type: source_summary
  explanation: 每层先聚合邻域表示，再用聚合消息更新节点表示；堆叠层可扩大信息范围。
  citations:
  - source_id: mit6-7960-f24-lec5-3b5ab40fdb
    anchor:
      type: page
      value: 16
  - source_id: mit6-7960-f24-lec5-3b5ab40fdb
    anchor:
      type: page
      value: 22
- id: c4
  term: 聚合与读出
  claim_type: source_summary
  explanation: 聚合是置换不变的多重集操作；图级任务还需用 READOUT 汇总节点表示。
