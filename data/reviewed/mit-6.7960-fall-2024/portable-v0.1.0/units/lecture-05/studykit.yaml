practice:
- id: p1
  level: 基础
  question: 分别为节点分类、链接预测和图分类各写出一个输入输出例子。
  hint: 确定预测对象。
  deliverable: 三行任务映射。
  expected_evidence:
  - 正确区分三个预测层级
  evaluation:
    full_credit: 三个例子均正确
    partial_credit: 至少两个正确
