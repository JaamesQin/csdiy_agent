    anchor:
      type: page
      value: 16
- id: p4
  level: 分析
  question: 比较多重集 {1,1,3} 与 {1,2,2} 在 sum、mean、max 下是否可区分。
  hint: 分别计算统计量。
  deliverable: 三行比较表。
  expected_evidence:
