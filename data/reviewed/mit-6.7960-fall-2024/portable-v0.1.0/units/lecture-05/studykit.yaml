  - source_id: mit6-7960-f24-lec5-3b5ab40fdb
    anchor:
      type: page
      value: 3
- id: p2
  level: 基础
  question: 说明节点重排时图嵌入与节点嵌入分别应如何变化。
  hint: 区分不变与等变。
  deliverable: 两句解释。
  expected_evidence:
  - 图级不变
  - 节点级随置换重排
  evaluation:
    full_credit: 两类输出均判断正确
    partial_credit: 只判断正确一类
  citations:
  - source_id: mit6-7960-f24-lec5-3b5ab40fdb
    anchor:
      type: page
      value: 11
- id: p3
  level: 应用
  question: 对路径图 1—2—3，以标量 1、2、4 为初始表示，用邻居求和聚合、旧表示加消息更新，计算一轮结果。
  hint: 端点一个邻居，中点两个邻居。
  deliverable: 逐节点消息和更新值。
  expected_evidence:
  - 邻域正确
  - 计算步骤正确
  evaluation:
    full_credit: 三个节点均正确
    partial_credit: 流程正确但有算术错误
  citations:
