core_concepts:
- id: concept-1
  term: 深度学习的两种视角
  claim_type: source_summary
  explanation: 讲义一方面把神经网络描述为线性变换与逐点非线性交替堆叠的机器学习架构；另一方面把可微编程描述为参数化程序的一部分，并由基于梯度的优化调节参数。两者分别回答“模型由什么组成”和“程序如何从数据中被调节”。
  citations:
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 2
- id: concept-2
  term: 多层结构与 XOR
  claim_type: source_summary
  explanation: 讲义用 XOR 说明单层感知机的表达限制，并指出多层网络能够表示这种单层不能表示的函数；PDP 作者把反向传播视为训练多层网络的关键突破。
  citations:
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 14
- id: concept-3
  term: 梯度下降
  claim_type: source_summary
  explanation: 训练先定义所有样本损失的目标函数，再在当前参数处计算梯度，以学习率缩放后沿负梯度方向更新。学习率控制单步变化尺度，参数是优化变量。
  citations:
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 27
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 30
- id: concept-4
  term: 线性层、偏置与非线性
  claim_type: source_summary
  explanation: 线性层把输入乘以权重并加偏置；逐点非线性随后改变每个单元。只有不断堆叠线性层而没有非线性时，整体仍等价于一次线性变换，因而不能获得讲义强调的非线性映射能力。
  citations:
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 33
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 36
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 54
- id: concept-5
  term: 激活函数的行为
  claim_type: source_summary
  explanation: tanh 输出在 −1 与 1 之间且大幅输入会饱和；sigmoid 输出在 0 与 1 之间、也会饱和且以 0.5 为中心；ReLU
    正半轴无界、实现高效，但处于强负区间时可能没有梯度。选择激活函数就是选择信号与梯度如何传播。
  citations:
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 39
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 40
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 41
- id: concept-6
  term: 深度是函数复合
  claim_type: source_summary
  explanation: 多层网络把前一层输出作为后一层输入，因此可写成多层函数的嵌套复合。讲义同时提醒层数存在按参数层或表示层计数的不同约定，讨论深度时应先声明口径。
  citations:
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 38
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 43
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 54
- id: concept-7
  term: softmax 与交叉熵
  claim_type: source_summary
  explanation: 分类器给出各类别分数，softmax 将其转为预测分布；交叉熵按真实标签读取相应预测概率的负对数并汇总。预测给真实类别的概率越小，该样本损失越大。
  citations:
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 55
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 57
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 59
- id: concept-8
  term: 数据、参数、批与张量
  claim_type: source_summary
  explanation: 输入和各层激活都是随样本变化的数据表示，权重与偏置是跨样本复用并被学习的参数。批处理将多个样本并行组织；图像常用 batch×H×W×C
    的多维张量表达，权重与偏置也可表示为张量。
  citations:
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 61
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 68
  - source_id: mit6-7960-f24-lec1-e46f8dc954
    anchor:
      type: page
      value: 71
glossary:
- term: perceptron
  translation: 感知机
  definition: 线性组合后接阈值式逐点非线性的早期神经网络单元。
- term: parameter
  translation: 参数
  definition: 在训练中被优化、跨样本复用的权重或偏置。
- term: representation
  translation: 表示
  definition: 输入或中间层对数据的数值编码。
- term: activation function
  translation: 激活函数
  definition: 在线性变换后逐点施加的非线性函数。
- term: softmax
  translation: softmax
  definition: 把类别分数转换为归一化预测分布的操作。
- term: cross-entropy
  translation: 交叉熵
  definition: 用真实标签评价预测分布的分类损失。
- term: tensor
  translation: 张量
  definition: 组织批、空间、通道等多个轴的多维数组。
common_misconceptions:
- misconception: 深度学习只等于层数很多的神经网络。
  correction: 本讲还用可微编程描述通过梯度优化参数化程序的范式。
- misconception: 只要堆叠很多线性层就能获得任意非线性能力。
  correction: 线性层复合仍是线性的；逐点非线性是关键构件。
- misconception: tanh、sigmoid 和 ReLU 只有输出范围不同。
  correction: 它们的饱和、中心位置和零梯度区域也影响优化。
- misconception: 中间激活与权重都属于模型参数。
  correction: 激活随输入变化，是数据表示；权重和偏置才是训练参数。
