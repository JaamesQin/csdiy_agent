learning_objectives:
- id: obj-1
  objective: 区分“神经网络架构”与“可微编程”两种深度学习视角。
- id: obj-2
  objective: 解释多层结构、反向传播和数据/算力共同推动深度学习发展的逻辑。
- id: obj-3
  objective: 按数据形状说明线性层、逐点非线性和多层函数复合。
- id: obj-4
  objective: 比较 tanh、sigmoid 与 ReLU 的输出范围、饱和和梯度行为。
- id: obj-5
  objective: 串联分类输出、softmax、交叉熵、经验风险和梯度下降。
- id: obj-6
  objective: 阅读 batch×H×W×C 等张量形状并把本讲放入全课主题地图。
prerequisites:
- topic: 函数与复合函数
  required_level: 能把多步计算写成函数复合，并识别输入和输出。
- topic: 向量与矩阵
  required_level: 能进行矩阵—向量乘法并检查输入、输出维度。
- topic: 一阶导数
  required_level: 理解导数给出局部变化方向；链式法则将在下一讲展开。
- topic: 概率基础
  required_level: 理解类别概率、one-hot 标签和对数。
