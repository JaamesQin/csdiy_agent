core_concepts:
- id: c1
  term: 序列与状态压缩
  claim_type: source_summary
  explanation: 序列数据沿时间排列。若保留全部历史，记忆随时间增长且属于非参数存储；RNN 用隐藏状态把过去压缩为固定维表示，并假设未来状态只直接依赖前一隐藏状态和当前输入。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 9
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 20
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 29
- id: c2
  term: RNN 状态更新
  claim_type: source
  explanation: 在时间 t，更新函数 f 把上一隐藏状态和当前输入映射为新状态，输出函数 g 再从新状态产生输出。展开图把一个带反馈的递归层表示为有限时间
    DAG。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 20
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 21
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 22
  formula:
    status: resolved
    latex: h_t=f(h_{t-1},x_{\mathrm{in}}[t]),\qquad x_{\mathrm{out}}[t]=g(h_t)
    citation:
      source_id: mit6-7960-f24-lec10-17b3fa52fe
      anchor:
        type: page
        value: 21
    warnings:
    - 公式已由统一 page-image 视觉核对。
- id: c3
  term: 跨时间权重共享与 BPTT
  claim_type: source_summary
  explanation: 展开后每个时间步使用同一组参数。总目标对共享参数的梯度由各时间副本的贡献累加；反向传播沿展开图穿过多个状态转换。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 22
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 28
  formula:
    status: resolved
    latex: \frac{\partial J}{\partial[W,U,V]}=\sum_{t=0}^{T}\frac{\partial\mathcal{L}(x_{\mathrm{out}}[t],y_t)}{\partial[W,U,V]}
    citation:
      source_id: mit6-7960-f24-lec10-17b3fa52fe
      anchor:
        type: page
        value: 28
    warnings:
    - 页面同时用 W 的各时间副本说明共享参数梯度求和；这里只保留清晰的总梯度式。
- id: c4
  term: 长程依赖与梯度稳定性
  claim_type: source_summary
  explanation: RNN 理论上能把遥远信息编码进当前隐藏状态，但依赖链需要反复经过相同转换；课件用长链说明梯度可能消失或爆炸，因此表达可能性不等于训练可达性。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 29
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 30
- id: c5
  term: LSTM cell state 与遗忘门
  claim_type: source_summary
  explanation: LSTM 被设计为不默认遗忘旧状态。cell state 提供较直接的信息通道；遗忘门根据上一隐藏状态与当前输入产生接近 0–1 的逐元素系数，决定保留或丢弃旧
    cell 信息。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 32
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 35
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 36
  formula:
    status: resolved
    latex: f_t=\sigma\!\left(W_f[h_{t-1},x_t]+b_f\right)
    citation:
      source_id: mit6-7960-f24-lec10-17b3fa52fe
      anchor:
        type: page
        value: 36
    warnings:
    - 公式已由统一 page-image 视觉核对；接近 0/1 是门值解释，不声称始终为精确二值。
- id: c6
  term: LSTM 写入、更新与输出
  claim_type: source_summary
  explanation: 写入阶段先选择要更新的索引并构造候选信息；随后遗忘选定旧信息并写入新信息；最后依据更新后的 cell state 决定当前输出。三个阶段不能互换。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 37
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 38
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 39
- id: c7
  term: 自回归概率分解
  claim_type: source
  explanation: 联合序列概率可按链式法则分解为每个元素在其前缀条件下的概率乘积。模型因而把序列学习转成一组下一元素预测。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 41
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 43
  formula:
    status: resolved
    latex: p(X)=\prod_{i=1}^{n}p(x_i\mid x_1,\ldots,x_{i-1})
    citation:
      source_id: mit6-7960-f24-lec10-17b3fa52fe
      anchor:
        type: page
        value: 43
    warnings:
    - 公式已由统一 page-image 视觉核对。
- id: c8
  term: 词表示、最大似然与交叉熵
  claim_type: source_summary
  explanation: 课件把词表示为词表大小 K 的 one-hot 向量，并把训练写为模型输出与 one-hot 目标之间的交叉熵最小化。训练图使用真实前序词作为条件；生成时可从预测分布采样或选择最可能词。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 45
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
