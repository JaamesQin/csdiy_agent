  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 52
  formula:
    status: resolved
    latex: f^*=\arg\min_{f\in\mathcal{F}}\sum_{i=1}^{N}H(y_i,\hat y_i)
    citation:
      source_id: mit6-7960-f24-lec10-17b3fa52fe
      anchor:
        type: page
        value: 50
    warnings:
    - 课件称其为最大似然目标；此处只转写可见的交叉熵优化式。
- id: c9
  term: 递归、卷积与注意力的时间共享
  claim_type: source_summary
  explanation: 递归在时间上共享 recurrent weights；时序卷积共享 convolution weights；注意力权重则由数据动态决定。后两类方法可直接连接旧观察或隐藏状态到未来预测，减轻只靠递归状态传递的路径限制。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 57
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 58
