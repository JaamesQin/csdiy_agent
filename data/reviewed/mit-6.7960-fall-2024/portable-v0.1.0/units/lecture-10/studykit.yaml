review:
  generator_review_status: audited_draft
  audit_findings:
  - 69 页原 PDF 已逐页盘点；RNN、BPTT、LSTM 遗忘门、自回归和交叉熵公式用统一 page-images 核对。
  - 外部论文列表只按课件分类，不扩写为论文定理或当前产品规格。
  - 第三方图像页不作为视觉事实来源；练习只使用抽象序列与计算图。
  - 学习顺序合计 180 分钟，8 道练习从 RNN 展开递进到长上下文评估。
limitations:
- PDF 第1页标题为 Lecture 10，第2页可见编号写作 11；本包按文件名、元数据和项目 unit 约定使用 lecture-10，并记录此源内不一致。
- 多页原生文本含 latexit 载荷和重叠书稿；精确公式仅采用经过 page-image 核对的页面。
- 第60—63页列举的模型复杂度和上下文窗口属于 Fall 2024 课件陈述，不作为 2026 年当前产品规格。
- 未摄取课件链接的外部论文；对 Reformer、Performer、Linformer、Transformer-XL、Longformer、BigBird 与
  RETRO 只做页面级分类。
- 第三方权利图像不复制、不描述其视觉细节。
