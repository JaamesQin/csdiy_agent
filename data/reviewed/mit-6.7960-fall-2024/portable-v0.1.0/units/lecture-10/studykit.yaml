common_misconceptions:
- misconception: RNN 隐藏状态固定大小，所以不能表示任何远距离依赖。
  correction: 课件指出它可把相关远期信息压入隐藏状态；困难在于选择和学习保留什么。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 29
- misconception: LSTM 默认记住一切且不会遗忘。
  correction: 它改变默认信息流并学习遗忘门；门仍可选择丢弃或写入信息。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 32
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 36
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 38
- misconception: 训练和生成时每一步使用相同来源的前序词。
  correction: 训练图使用真实前序词，生成时使用模型选择或采样的词。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 51
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 52
- misconception: 更大的上下文窗口证明模型有效使用了全部历史。
  correction: 窗口只是可接收长度，还需任务证据长度、截断和检索消融。
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
