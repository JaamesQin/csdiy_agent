practice:
- id: p1
  level: 基础
  question: 为一段长度 5 的输入写出 RNN 展开表，逐步列出 h_t 依赖的两个直接输入和 x_out[t] 的来源。
  hint: 每一步复用同一个 f 与 g。
  deliverable: 5 行时间步依赖表。
  expected_evidence:
  - h_t 依赖 h_{t-1} 与当前输入
  - 输出来自当前 h_t
  - 参数跨时间共享
  evaluation:
    criteria:
    - 时间索引正确
    - 无未来信息
    - 共享关系清楚
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 20
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 21
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 22
- id: p2
  level: 核心推导
  question: 给定 J=Σ_t L_t，解释共享参数 W 的梯度为何要累加所有时间副本的贡献，并画出至少三步反向路径。
  hint: 展开图中的 W_i 是同一参数的使用位置。
  deliverable: 一条梯度求和式和一张反向路径图。
  expected_evidence:
  - 目标按时间求和
  - 共享参数贡献累加
  - 路径经过隐藏状态链
  evaluation:
    criteria:
    - 链式法则方向正确
    - 不把 W_i 当独立训练参数
    - 图可复核
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 28
- id: p3
  level: 诊断
  question: 分别构造一个梯度消失和梯度爆炸的定性案例，说明为什么“RNN 可表达任意远依赖”不保证能学到它。
  hint: 考虑长链中局部导数反复相乘。
  deliverable: 两段路径解释和一条表达/优化边界。
  expected_evidence:
  - 长链反复乘积
  - 消失与爆炸方向正确
  - 区分表达与训练
  evaluation:
    criteria:
    - 机制准确
    - 边界明确
    - 不杜撰数值阈值
  citations:
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 29
  - source_id: mit6-7960-f24-lec10-17b3fa52fe
    anchor:
      type: page
      value: 30
- id: p4
  level: 结构追踪
  question: 按遗忘、写入、cell 更新、输出四步标注 LSTM 信息流，并解释遗忘门接近 0 与接近 1 的不同含义。
  hint: 先沿 C_{t-1} 到 C_t 的主通道走。
  deliverable: 四步流程图和门值解释。
