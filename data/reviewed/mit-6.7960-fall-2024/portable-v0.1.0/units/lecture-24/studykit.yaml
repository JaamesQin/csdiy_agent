    anchor:
      type: page
      value: 16
- id: p3
  level: 分析
  question: 在固定候选生成模型下，对比 Best-of-8 与 beam width 8：候选何时被剪枝、最终按什么分数选、各自可能错过什么？
  hint: 一个先生成完整样本，一个逐层保留前缀。
  deliverable: 三维对照表。
