glossary:
- term: teacher forcing
  definition: 训练序列模型时用真实前缀作为下一步条件。
- term: greedy decoding
  definition: 每一步选择当前概率最高的输出。
- term: Best-of-N
  definition: 生成 N 个完整候选并按评分选择一个。
- term: beam search
  definition: 逐层扩展并只保留固定数量高分前缀的近似树搜索。
- term: verifier
  definition: 对候选正确性或其他目标进行评分的组件。
- term: test-time training
  definition: 依据当前测试查询或相关测试数据在部署时更新模型参数。
common_misconceptions:
- misconception: 贪心解码最大化完整序列概率。
  correction: 它只在每一步局部最大化，前缀选择会改变后续分布。
- misconception: 最高似然候选就是任务上最好的候选。
  correction: 似然、正确性、人类偏好和安全可能是不同目标。
- misconception: 验证器存在就保证搜索正确。
  correction: 验证器必须可靠且难以被候选利用。
- misconception: 上下文拟合改善保证新查询改善。
  correction: 上下文目标和查询目标之间仍有泛化间隙。
