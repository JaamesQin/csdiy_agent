core_concepts:
- id: c1
  term: 训练—适配—搜索连续谱
  claim_type: source_summary
  explanation: 预训练从数据学习模型；后训练用新数据更新模型；部署时适配依据测试数据改变模型或行为；搜索则针对一个查询在候选中寻找答案。
  citations:
  - source_id: mit6-7960-f24-lec24-64cb817545
    anchor:
      type: page
      value: 3
- id: c2
  term: 自回归序列概率与解码
  claim_type: explanation
  explanation: 教师强制用真实前缀训练下一项预测，部署时由生成前缀递归驱动。完整序列概率由逐步条件概率相乘，故每步取最大概率的贪心解码不保证全局最高概率序列。
  citations:
  - source_id: mit6-7960-f24-lec24-64cb817545
    anchor:
      type: page
      value: 14
  - source_id: mit6-7960-f24-lec24-64cb817545
    anchor:
      type: page
      value: 15
  - source_id: mit6-7960-f24-lec24-64cb817545
    anchor:
      type: page
      value: 16
- id: c3
  term: Best-of-N 与 beam search
  claim_type: source_summary
  explanation: Best-of-N 独立采样 N 个完整序列再按评分选择；beam search 在树的每一层保留有限数量的候选前缀。二者都受候选覆盖、预算和评分器限制，不是精确全局搜索。
  citations:
  - source_id: mit6-7960-f24-lec24-64cb817545
    anchor:
      type: page
      value: 17
  - source_id: mit6-7960-f24-lec24-64cb817545
    anchor:
      type: page
      value: 18
- id: c4
  term: 验证器引导搜索
  claim_type: inference
  explanation: 搜索可优化模型似然之外的分数。当验证确实比生成容易且分数与任务目标一致时，它能筛掉错误候选；若评分器失真，增加搜索会更强地优化代理目标而非真实质量。
  citations:
  - source_id: mit6-7960-f24-lec24-64cb817545
    anchor:
