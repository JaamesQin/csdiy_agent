    anchor:
      type: page
      value: 22
- id: c5
  term: 部署时适配与搜索—学习闭环
  claim_type: explanation
  explanation: 上下文示例可改变输出条件分布；某些理论构造把这种变化表达为类似梯度更新，但不是普遍等价。测试时训练显式依据查询或相关样本更新参数；搜索产生的经验证轨迹还可成为训练数据，训练策略再引导下一轮搜索。
