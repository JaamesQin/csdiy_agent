practice:
- id: p1
  level: 基础
  question: 把微调、上下文学习、测试时训练、Best-of-N 分别放入后训练、部署适配或搜索，并说明是否更新模型参数。
  hint: 先判断操作发生在何时，再判断改变参数还是只选择候选。
  deliverable: 四行分类表。
  expected_evidence:
  - 微调属于后训练并更新参数
  - 上下文学习改变条件但通常不显式更新参数
  - 测试时训练在部署时更新参数
  - Best-of-N 生成并选择候选
  evaluation:
    full_credit: 四项时机和参数状态均正确
    partial_credit: 至少三项正确
  citations:
  - source_id: mit6-7960-f24-lec24-64cb817545
    anchor:
      type: page
      value: 3
  - source_id: mit6-7960-f24-lec24-64cb817545
    anchor:
      type: page
      value: 41
- id: p2
  level: 应用
  question: 构造一个两步概率树，使第一步概率最高的分支不包含全局概率最高的完整序列。
  hint: 完整序列概率等于两步条件概率之积。
  deliverable: 四条路径概率和贪心/全局选择。
  expected_evidence:
  - 条件概率合法
  - 计算完整路径乘积
  - 贪心结果与全局最高结果不同
  evaluation:
    full_credit: 概率、计算和反例逻辑完整
    partial_credit: 结论正确但概率树不完整
  citations:
