learning_objectives:
- id: obj-1
  objective: 解释神经网络架构为何在训练前已经表达对输入相似性的偏好。
- id: obj-2
  objective: 比较核展开与高斯过程对函数空间的两种构造。
- id: obj-3
  objective: 用有限集合联合高斯和协方差函数描述高斯过程。
- id: obj-4
  objective: 解释高斯条件化如何从观测得到新点的预测分布。
- id: obj-5
  objective: 概述无限宽随机神经网络趋于高斯过程的论证。
- id: obj-6
  objective: 分析架构、非线性和权重分布如何改变诱导的相似性。
