core_concepts:
- id: concept-1
  term: 架构偏置
  claim_type: source_summary
  explanation: 神经网络把输入逐层映射到新的向量空间；理想的末层表示可让任务变得线性可分。本讲的核心主张是，即使不训练，架构也会通过随机函数的相似性结构表达对数据的偏好。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 6
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 7
- id: concept-2
  term: 核展开与 RKHS
  claim_type: source_summary
  explanation: 一种构造函数空间的方法是把以样本点为中心的核函数线性组合，形式为 f(x)=Σᵢ αᵢk(x,xᵢ)。核决定局部影响和相似性，系数决定组合。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 9
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 11
- id: concept-3
  term: 高斯过程
  claim_type: source_summary
  explanation: 高斯过程是函数上的概率分布：任取有限输入集合，对应函数值都联合高斯。它让“随机采样一个函数”可由有限点上的高斯向量来理解。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 13
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 15
- id: concept-4
  term: 协方差函数
  claim_type: source_summary
  explanation: 有限维高斯向量的协方差矩阵推广为输入对上的协方差函数。它编码哪些输入应当产生相关输出；讲义以平方指数形式和内积形式说明不同的“邻近”定义。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 16
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 17
- id: concept-5
  term: 高斯条件化
  claim_type: source_summary
  explanation: 观测若干输入处的函数值后，可对联合高斯分布做条件化；新输入处的预测仍为高斯，并具有闭式均值和不确定性。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 18
- id: concept-6
  term: 无限宽神经网络—高斯过程对应
  claim_type: source_summary
  explanation: 随机初始化网络定义随机函数。对固定有限输入集合，层宽趋于无穷时，独立权重下的输出由多元中心极限定理和逐层归纳趋向联合高斯。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 20
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 23
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 24
- id: concept-7
  term: 架构诱导核
  claim_type: source_summary
  explanation: 无限宽极限中的协方差依赖架构、非线性和权重分布。ReLU MLP 示例中，fan-in 缩放的独立高斯权重给出零均值过程，协方差随深度反复复合相应核映射，因此架构选择就是相似性选择。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 25
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 26
glossary:
- term: kernel
  translation: 核函数
  definition: 衡量输入对相似性并用于构造函数的二元函数。
- term: RKHS
  translation: 再生核希尔伯特空间
  definition: 由核组织的一类函数空间。
- term: Gaussian process
  translation: 高斯过程
  definition: 任意有限函数值集合都联合高斯的随机函数模型。
- term: covariance function
  translation: 协方差函数
  definition: 为输入对指定输出共同变化强度的函数。
- term: architectural bias
  translation: 架构偏置
  definition: 架构在训练前对函数与相似性结构施加的偏好。
common_misconceptions:
- misconception: 只有训练数据和损失才会形成归纳偏置。
  correction: 本讲指出随机初始化架构本身已诱导协方差和相似性结构。
- misconception: 高斯过程要求输入本身服从高斯分布。
  correction: 联合高斯的是有限输入集合对应的函数值。
- misconception: 无限宽对应意味着所有神经网络都等同于同一个高斯过程。
  correction: 诱导协方差依赖架构、非线性和权重分布。
