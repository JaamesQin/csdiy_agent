practice:
- id: ex-1
  level: 基础
  question: 画出输入经过多层向量空间到线性可分表示的路径，并说明架构偏置在训练前可能出现在哪里。
  hint: 区分层间映射和训练得到的任务边界。
  deliverable: 一张流程图和 100 字说明。
  expected_evidence:
  - 指出逐层表示
  - 指出未训练架构已定义函数族
  evaluation:
    full_credit: 准确连接表示路径与训练前偏置。
    partial_credit: 只画路径但未解释偏置。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 6
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 7
- id: ex-2
  level: 基础
  question: 用三个中心点和自选系数示意 f(x)=Σᵢαᵢk(x,xᵢ) 如何由局部核形状合成函数。
  hint: 先画每一项，再画相加结果。
  deliverable: 一幅分解图和系数作用说明。
  expected_evidence:
  - 核中心和系数作用正确
  evaluation:
    full_credit: 分项与总和对应清楚。
    partial_credit: 有示意但未区分核与系数。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 9
- id: ex-3
  level: 进阶
  question: 比较平方指数协方差和内积协方差各自把什么样的输入视为相似。
  hint: 分别观察距离和夹角/投影。
  deliverable: 两行比较表。
  expected_evidence:
  - 正确区分距离型与内积型相似性
  evaluation:
    full_credit: 两种相似性解释准确。
    partial_credit: 只写公式未解释含义。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 17
- id: ex-4
  level: 进阶
  question: 给定四个输入，说明“这些函数值联合高斯”需要检查什么，并区分它与每个边缘分布分别为高斯。
  hint: 联合分布包含协方差关系。
  deliverable: 120 字辨析。
  expected_evidence:
  - 强调联合高斯及协方差
  evaluation:
    full_credit: 准确说明联合条件强于边缘条件。
    partial_credit: 只重复定义。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 15
- id: ex-5
  level: 进阶
  question: 定性画出观测前后的预测均值和不确定性，解释为什么观测点附近的不确定性通常改变。
  hint: 用协方差描述观测点与新点的信息传递。
  deliverable: 前后两图与 120 字说明。
  expected_evidence:
  - 条件化逻辑正确
  - 关联协方差
  evaluation:
    full_credit: 均值、不确定性和协方差关系完整。
    partial_credit: 图正确但解释不完整。
  citations:
  - source_id: mit6-7960-f24-lec13-db998b131f
    anchor:
      type: page
      value: 18
- id: ex-6
  level: 挑战
  question: 把“随机权重→固定输入上的随机向量→宽度极限→联合高斯→逐层归纳”排成证明草图，并标出中心极限定理使用位置。
  hint: 只概述讲义给出的证明结构。
  deliverable: 五节点证明流程。
  expected_evidence:
