core_concepts:
- id: concept-1
  term: GD、SGD 与动量
  claim_type: source_summary
  explanation: 总体目标是样本损失之和或平均。全批量梯度下降每次使用全部 N 个样本；SGD 使用一个样本或小批量，得到总体梯度的带噪近似；动量把历史更新方向混入当前步，可能加速也可能带来不利影响。
  citations:
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 8
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 9
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 10
- id: concept-2
  term: 优化病态与梯度裁剪
  claim_type: source_summary
  explanation: 消失梯度使进展很慢且噪声可能占主导；零梯度不给出改进方向；爆炸梯度导致不稳定和越过最优区；多局部极小值使初始化影响结果。梯度裁剪通过限制梯度范数缓解爆炸。
  citations:
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 17
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 18
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 19
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 20
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 22
- id: concept-3
  term: 计算图
  claim_type: source_summary
  explanation: 计算图由函数变换节点组成；深度学习主要使用节点可微的有向无环图。前向传播按拓扑顺序计算中间值和损失，反向传播从标量损失端逆序传播梯度。
  citations:
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 26
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 28
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 29
- id: concept-4
  term: Jacobian 链式法则
  claim_type: source_summary
  explanation: 讲义采用 row-Jacobian 排布。若 z 的长度为 m、u 为 p、x 为 n，则 z 对 u 的 Jacobian 为 m×p，u
    对 x 为 p×n，乘积得到 z 对 x 的 m×n Jacobian；乘法次序由中间维 p 决定。
  citations:
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 32
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 34
- id: concept-5
  term: 局部 backward 与完整算法
  claim_type: source_summary
  explanation: 一个通用层的 backward 接收下游的输出梯度，结合局部导数产生对输入和参数的梯度。训练的一次迭代先完成所有层前向，再从损失端逆序反向，最后统一更新参数；不能在梯度尚未完整计算时提前改参数。
  citations:
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 38
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 42
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 44
- id: concept-6
  term: 线性层与批梯度
  claim_type: source_summary
  explanation: 对 x_out=W x_in，输入梯度由输出梯度与 W 组合，权重梯度由输入与输出梯度形成外积式矩阵。批目标取样本损失平均，因此总梯度也是各样本梯度的平均。这里沿用讲义的
    row-gradient 方向。
  citations:
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 45
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 46
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 48
- id: concept-7
  term: DAG 分支与参数共享
  claim_type: source_summary
  explanation: 一个变量沿多条路径影响损失时，回到该变量的梯度要把各路径贡献相加；同一参数在多个位置共享时，对每个使用点的参数梯度也必须全部累加。
  citations:
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 53
  - source_id: mit6-7960-f24-lec2-a494aaf941
    anchor:
      type: page
      value: 55
- id: concept-8
  term: 可微编程与优化输入
  claim_type: source_summary
  explanation: 反向传播可以针对任意标量目标，计算目标对图中函数参数或变量的变化率。训练通常优化模型参数；特征可视化则固定模型、优化输入像素或中间单元目标，两者使用同一求导机制但优化变量不同。
  citations:
