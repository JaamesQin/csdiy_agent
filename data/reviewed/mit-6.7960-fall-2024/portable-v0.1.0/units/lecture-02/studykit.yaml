glossary:
- term: computation graph
  translation: 计算图
  definition: 用函数节点和变量边表示计算依赖的有向图。
- term: Jacobian
  translation: 雅可比矩阵
  definition: 向量输出对向量输入的一阶偏导矩阵。
- term: forward pass
  translation: 前向传播
  definition: 按依赖顺序计算中间激活、输出和损失。
- term: backpropagation
  translation: 反向传播
  definition: 从标量损失出发，逆序组合局部导数以计算梯度。
- term: gradient clipping
  translation: 梯度裁剪
  definition: 在更新前限制梯度大小以缓解爆炸梯度。
- term: parameter sharing
  translation: 参数共享
  definition: 同一参数在计算图多个位置被复用，梯度需汇总。
- term: differentiable programming
  translation: 可微编程
  definition: 用可微模块构造程序，并以梯度优化其中变量或参数。
common_misconceptions:
- misconception: SGD 每步一定只用一个样本。
  correction: 单样本是 batch=1 的边界，小批量同样属于随机梯度方法。
- misconception: 只要函数处处可导，梯度下降就一定容易。
  correction: 消失、零、爆炸梯度和局部极小值仍会妨碍优化。
- misconception: 反向传播是在每经过一层时立刻更新该层参数。
  correction: 一次迭代先前向、再完整反向、最后统一更新。
- misconception: 分支或共享参数只保留一条路径的梯度。
  correction: 所有下游路径或使用点的贡献必须相加。
- misconception: 反向传播只能求损失对模型权重的梯度。
  correction: 它也可求标量目标对输入或中间变量的梯度。
