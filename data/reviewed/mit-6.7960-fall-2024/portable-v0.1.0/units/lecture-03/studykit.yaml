core_concepts:
- id: concept-1
  term: 机器学习三块拼图
  claim_type: source_summary
  explanation: 近似问模型族中是否存在能拟合的网络；优化问能否找到它；泛化问它在未见数据上是否表现良好。本讲主要回答第一问，因此后续存在性定理不能自动推出可训练或可泛化。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 4
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 34
- id: concept-2
  term: L-Lipschitz 函数与 RMS 范数
  claim_type: source_summary
  explanation: 一维条件用 L 控制输入变化引起的函数变化；多维版本把输入变化用 RMS 范数度量。这里的直觉是函数变化速度受到统一上界约束。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 8
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 9
  formula:
    status: resolved
    latex: \|x\|_{\mathrm{RMS}}=\sqrt{\frac{1}{d}\sum_{i=1}^{d}x_i^2},\qquad |g(x+\Delta
      x)-g(x)|\le L\|\Delta x\|_{\mathrm{RMS}}
    citation:
      source_id: mit6-7960-f24-lec3-d7db2ac9fd
      anchor:
        type: page
        value: 9
    warnings: []
- id: concept-3
  term: 三层 ReLU 逼近定理
  claim_type: source
  explanation: 对 [0,1]^d 上任意 L-Lipschitz 函数与任意 epsilon>0，幻灯片给出一个三层 ReLU 网络，其单元数为 N=4d(L/epsilon)^d，并使积分绝对误差小于
    2epsilon。指数来自 (L/epsilon)^d，而 4d 是线性前因子。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 10
  formula:
    status: resolved
    latex: N=4d\left(\frac{L}{\varepsilon}\right)^d,\qquad \int_{[0,1]^d}|f(x)-g(x)|\,dx<2\varepsilon
    citation:
      source_id: mit6-7960-f24-lec3-d7db2ac9fd
      anchor:
        type: page
        value: 10
    warnings: []
- id: concept-4
  term: 矩形条误差
  claim_type: source_summary
  explanation: 在一维中把区间分成 N 个宽 1/N 的条。Lipschitz 性把每条的误差帽控制为三角形；N 条相加得到 L/(2N)，所以要达到
    epsilon 误差，只需令 N 至少为 L/(2epsilon)（幻灯片后续常忽略常数讨论数量级）。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 12
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 13
  formula:
    status: resolved
    latex: \int|f(x)-g(x)|\,dx\le N\cdot\frac12\cdot\frac1N\cdot\frac LN=\frac{L}{2N}
    citation:
      source_id: mit6-7960-f24-lec3-d7db2ac9fd
      anchor:
        type: page
        value: 13
    warnings: []
- id: concept-5
  term: 高维超矩形与维度灾难
  claim_type: source_summary
  explanation: 高维把矩形条替换为边长 1/N^(1/d) 的超矩形。幻灯片给出的 epsilon 级误差需要 (L/epsilon)^d 个超矩形，因此需求随维度指数增长。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 14
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 18
  formula:
    status: resolved
    latex: N=\left(\frac{L}{\varepsilon}\right)^d
    citation:
      source_id: mit6-7960-f24-lec3-d7db2ac9fd
      anchor:
        type: page
        value: 14
    warnings: []
- id: concept-6
  term: ReLU 超矩形阈值
  claim_type: source_summary
  explanation: 每个坐标先由一维近似矩形给出是否“开启”的值；把 d 个值相加并在 d-1 处阈值化，只有各坐标矩形同时开启时才保留。再对平移后的超矩形做线性组合以逼近曲面。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 16
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 17
  formula:
    status: resolved
    latex: h_c(x)=\operatorname{ReLU}\!\left(\sum_{i=1}^{d}f_c(x_i)-(d-1)\right)
    citation:
      source_id: mit6-7960-f24-lec3-d7db2ac9fd
      anchor:
        type: page
        value: 17
    warnings:
    - 页 15/17 的一维 f_c 子网络手写向量/上标仍有歧义，因此这里只保留清晰可见的高维阈值公式。
- id: concept-7
  term: UFA 不等于学习成功
  claim_type: source_summary
  explanation: 幻灯片指出矩形表示在训练点处可能只学到局部矩形，权重衰减还会压低其他矩形，因而不泛化；同时 Fourier 级数、多项式和 Python
    程序空间都可作为 UFA 例子，但并非因此就是常用学习模型。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 19
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 21
- id: concept-8
  term: PWL、kink 与层间上界
  claim_type: source_summary
  explanation: kink 是梯度改变的位置。ReLU 是 PWL，PWL 对加法、复合与数乘封闭，所以 ReLU 网络也是 PWL。加宽时 kinks
    至多相加；施加 ReLU 时每个线性段至多被零点再切一次，因此层间至多乘 2n。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 27
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 28
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 29
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 30
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 31
  formula:
    status: resolved
    latex: \operatorname{KINKS}_{\ell+1}\le2n\,\operatorname{KINKS}_{\ell},\qquad
      \operatorname{KINKS}_L\le(2n)^L
    citation:
      source_id: mit6-7960-f24-lec3-d7db2ac9fd
      anchor:
        type: page
        value: 31
    warnings: []
- id: concept-9
  term: tent map 深度分离
  claim_type: source_summary
  explanation: 页面 32 的 tent map 每自复合一次就把线性区域数翻倍。复合 500 次得到 1000 层、宽 2 的网络和 2^500-1
    个 kinks；若三层网络要达到相同数量，页面 33 给出的宽度约为 7×10^49。该结果仍只说明近似表达效率。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 32
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 33
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 34
  formula:
    status: resolved
    latex: n\ge\frac12(2^{500}-1)^{1/3}\approx7\times10^{49}
    citation:
      source_id: mit6-7960-f24-lec3-d7db2ac9fd
      anchor:
        type: page
        value: 33
    warnings: []
- id: concept-10
  term: 实践宽深比与混杂因素
  claim_type: source_summary
  explanation: 宽度便于并行而深度是顺序的；深度可能导致复合问题，但也可能带来表达效率。缩放律结果还会受学习率等训练流水线细节影响，所以最优宽深比不能只由近似定理决定。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 24
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 37
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
