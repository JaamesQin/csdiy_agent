glossary:
- term: approximation
  definition: 问模型族中是否存在满足误差要求的网络。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 4
- term: optimization
  definition: 在满足条件的网络存在时，问能否找到它。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 4
- term: generalization
  definition: 问模型在未见数据上是否表现良好。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 4
- term: L-Lipschitz
  definition: 函数变化不超过输入变化乘以常数 L。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 8
- term: UFA
  definition: universal function approximation；在相应函数族和误差意义下具有通用逼近能力。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 21
- term: PWL
  definition: piecewise linear，分段线性。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 27
- term: kink
  definition: 梯度发生变化的位置。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 27
- term: depth separation
  definition: 构造深网可高效表示、而浅网需指数更多单元才能表示的函数性质。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 25
common_misconceptions:
- misconception: 三层网络很宽，因此定理保证容易训练。
  correction: 定理只给存在性；页面 19 还展示了该构造可能训练/泛化不佳。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 19
- misconception: 定理的前因子是 4^d。
  correction: 可见公式是 4d(L/epsilon)^d；指数依赖位于 (L/epsilon)^d。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 10
- misconception: 页面 33 得到约 10^149 个单元。
  correction: 可见推导给出约 7×10^49 个单元。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 33
- misconception: 深度分离说明深网一定更容易优化、泛化更好。
  correction: 页面 34 明确否定这两种推论；结论只属于近似。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 34
- misconception: 缩放律图已经决定了最优宽深比。
  correction: 页面 39 强调学习率等训练流水线混杂因素会改变某些结果。
  citations:
  - source_id: mit6-7960-f24-lec3-d7db2ac9fd
    anchor:
      type: page
      value: 39
