  level: 基础
  question: 把下列问题分别归入 approximation、optimization、generalization：(a) 模型族中是否存在拟合训练数据的网络；(b)
    若存在，能否找到它；(c) 在未见数据上是否表现良好。再说明本讲主要回答哪一项。
  hint: 逐条对应页面 4 的三个问句，不要把“存在”写成“能训练出来”。
