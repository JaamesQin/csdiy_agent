      value: 68
- id: c2
  term: 微调与遗忘控制
  claim_type: source_summary
  explanation: 任务 A 的部分或全部参数用于初始化任务 B，随后继续训练。冻结多数层、小学习率、早停和继续使用原数据可缓解过拟合或遗忘，但这些策略依赖代表性验证。
  citations:
  - source_id: mit6-7960-f24-lec18-4295ed4e56
    anchor:
      type: page
      value: 11
  - source_id: mit6-7960-f24-lec18-4295ed4e56
    anchor:
      type: page
      value: 18
- id: c3
  term: 无监督域适配
  claim_type: source_summary
  explanation: UDA 使用有标签源域和无标签目标域共同适配；术语中的无监督特指目标域标签不可用。
  citations:
  - source_id: mit6-7960-f24-lec18-4295ed4e56
    anchor:
      type: page
      value: 21
- id: c4
