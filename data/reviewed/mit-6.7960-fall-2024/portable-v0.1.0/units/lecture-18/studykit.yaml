practice:
- id: p1
  level: 基础
  question: 把微调、知识蒸馏和视觉提示分别归到映射、输出、输入适配，并说明被改变的对象。
  hint: 观察页 68 中黄色部件。
  deliverable: 三行分类表。
  expected_evidence:
  - 微调对应映射参数
  - 蒸馏复用输出知识
  - 视觉提示改变输入
  evaluation:
    full_credit: 三项位置和对象均正确
    partial_credit: 至少两项正确
  citations:
  - source_id: mit6-7960-f24-lec18-4295ed4e56
    anchor:
      type: page
      value: 8
  - source_id: mit6-7960-f24-lec18-4295ed4e56
    anchor:
      type: page
      value: 68
- id: p2
  level: 应用
  question: 写出从任务 A 到任务 B 的微调参数流，并比较冻结编码器与全量微调更新哪些参数。
  hint: 从 W,b 到 W′,b′。
  deliverable: 参数流图加两列表。
  expected_evidence:
  - 复用任务 A 参数初始化任务 B
  - 冻结方案只更新新部件
  - 全量微调更新预训练参数
  evaluation:
    full_credit: 初始化和两类更新边界完整
    partial_credit: 只描述一种更新方式
  citations:
  - source_id: mit6-7960-f24-lec18-4295ed4e56
    anchor:
      type: page
      value: 11
- id: p3
  level: 分析
  question: 面对很小的新任务数据集，从冻结、小学习率、早停、混入原数据中选三项组成方案，并写出其共同前提。
  hint: 检查验证集是否代表部署分布。
  deliverable: 三项措施、各自目的和一条前提。
  expected_evidence:
  - 至少三项课件策略
  - 每项连接到过拟合或遗忘风险
  - 指出代表性验证集假设
  evaluation:
    full_credit: 措施、风险和前提均准确
    partial_credit: 列出措施但缺少验证假设
  citations:
  - source_id: mit6-7960-f24-lec18-4295ed4e56
    anchor:
      type: page
      value: 18
- id: p4
  level: 分析
  question: 为 UDA 数据清单标注哪些样本有标签：源域训练、目标域适配、目标域最终评估。并说明为何最终评估不应混入训练。
  hint: UDA 的目标域适配数据无标签。
  deliverable: 数据可用性矩阵。
  expected_evidence:
  - 源域有标签
  - 目标域适配无标签
  - 评估标签与训练隔离
  evaluation:
    full_credit: 三类数据角色与隔离正确
    partial_credit: 前两项正确但未解释隔离
  citations:
  - source_id: mit6-7960-f24-lec18-4295ed4e56
    anchor:
      type: page
      value: 21
- id: p5
  level: 综合
  question: 在全量微调、线性探测、软提示和蒸馏中，为资源受限的新任务选一种主方案；写出可训练部件、所需监督、风险和验证计划。
  hint: 少参数不等于零数据，也不保证迁移成功。
  deliverable: 四段决策备忘录。
  expected_evidence:
  - 方案与适配位置一致
  - 明确可训练和冻结部件
  - 说明标签或教师输出需求
  - 列出迁移失配风险
  - 包含任务内验证
  evaluation:
    full_credit: 五项证据完整且边界明确
    partial_credit: 方案合理但遗漏监督或风险
