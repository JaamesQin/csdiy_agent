  term: 迁移学习三视角
  claim_type: source_summary
  explanation: 迁移可以复用关于映射、输出或输入的知识；适配位置决定改变模型参数、输出头还是输入提示。
  citations:
  - source_id: mit6-7960-f24-lec18-4295ed4e56
