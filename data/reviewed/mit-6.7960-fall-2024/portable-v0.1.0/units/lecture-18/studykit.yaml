glossary:
- term: finetuning
  definition: 用预训练参数初始化新任务并继续更新部分或全部参数。
- term: catastrophic forgetting
  definition: 适配新任务时原有一般表示显著退化。
- term: UDA
  definition: 有标签源域加无标签目标域的无监督域适配。
- term: soft target
  definition: 教师模型给出的类别概率或分数分布。
- term: soft prompt
  definition: 在冻结主模型时学习的连续任务专用向量。
common_misconceptions:
- misconception: 微调等于从随机参数训练。
  correction: 微调复用预训练参数作为初始化。
- misconception: UDA 使用目标域标签。
  correction: 课件定义中目标域无标签，源域有标签。
- misconception: 蒸馏只是复制硬标签。
  correction: 软目标还表达非目标类别之间的相对关系。
- misconception: 参数高效适配必然无数据。
  correction: 它减少可训练参数，不自动消除任务数据和评估需求。
