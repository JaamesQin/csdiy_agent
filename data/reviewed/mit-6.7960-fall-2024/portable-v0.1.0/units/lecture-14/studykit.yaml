core_concepts:
- id: concept-1
  term: 生成模型
  claim_type: source_summary
  explanation: 生成模型既可指能产生类似数据样本的算法，也可用统计语言描述为数据变量上的联合概率分布。神经网络因此可从确定映射扩展为显式或隐式地表示输出分布。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 4
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 7
- id: concept-2
  term: PMF 与 PDF
  claim_type: source_summary
  explanation: 离散随机变量的概率质量函数在全部取值上求和为 1；连续随机变量的概率密度函数在全域积分为 1。密度值本身不等同于单点概率。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 8
- id: concept-3
  term: 直接与间接生成学习
  claim_type: source_summary
  explanation: 直接路线学习从潜变量 Z 到样本 X 的生成器；间接路线学习从样本 X 到实数分数的函数，再寻找高分区域。两者分别把困难放在映射生成和评分后采样。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 17
- id: concept-4
  term: 生成模型的泛化
  claim_type: source_summary
  explanation: 仅复刻训练集的“档案柜”能生成真实样本却没有学到可泛化分布。讲义建议在留出数据上用似然评估：新而真实的数据也应获得较高概率。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 25
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 27
- id: concept-5
  term: 能量模型
  claim_type: source_summary
  explanation: 能量函数为样本评分，并经配分函数归一化为密度。对数似然梯度包含降低数据能量的项与来自归一化常数、可写成模型分布期望的项；训练以数据样本和模型样本形成对比。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 30
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 33
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 34
- id: concept-6
  term: 自回归模型
  claim_type: source_summary
  explanation: 链式法则把联合分布精确分解为按顺序的条件分布；每一步可视为预测下一个词或值的分类问题，并按顺序采样生成完整对象。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 35
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 37
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 38
- id: concept-7
  term: 扩散模型
  claim_type: source_summary
  explanation: 前向过程逐步向数据加噪；生成时从简单噪声分布出发逐步去噪。训练构造相邻噪声层级的输入—目标对，把每一步变成监督预测，随机性使同一条件可产生不同结果。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 45
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 47
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 48
- id: concept-8
  term: 生成对抗网络
  claim_type: source_summary
  explanation: GAN 中生成器把潜变量映射为假样本，判别器区分真实与生成样本。训练交替更新判别器和生成器；讲义指出全局最优时生成分布复现数据分布。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 54
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 58
glossary:
- term: generative model
  translation: 生成模型
  definition: 定义或隐式实现数据分布并可生成样本的模型。
- term: probability mass function
  translation: 概率质量函数
  definition: 离散取值概率之和为 1 的函数。
- term: probability density function
  translation: 概率密度函数
  definition: 积分为 1、通过区间积分给出概率的函数。
- term: energy-based model
  translation: 能量模型
  definition: 以能量评分并经归一化定义密度的模型。
- term: autoregressive model
  translation: 自回归模型
  definition: 按顺序条件分解联合分布的模型。
- term: diffusion model
  translation: 扩散模型
  definition: 通过加噪前向过程和学习的逐步去噪生成样本的模型。
- term: GAN
  translation: 生成对抗网络
  definition: 由生成器和判别器交替对抗训练的生成模型。
common_misconceptions:
- misconception: 能生成训练样本就说明学会了数据分布。
  correction: 记忆训练集也能做到；需要在留出数据上检查泛化。
- misconception: PDF 在某一点的值就是该点概率。
  correction: 连续变量概率由区间上的密度积分给出。
- misconception: 扩散与自回归没有共同结构。
  correction: 两者都把生成组织为一系列可监督学习的预测问题，但顺序含义不同。
- misconception: GAN 同时一次性优化两个网络。
  correction: 讲义描述的是判别器和生成器交替训练。
