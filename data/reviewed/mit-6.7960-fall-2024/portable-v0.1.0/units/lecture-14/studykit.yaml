practice:
- id: ex-1
  level: 基础
  question: 分别给出一个离散和连续随机变量例子，写出 PMF 求和归一化与 PDF 积分归一化，并解释为什么连续单点密度不是单点概率。
  hint: 概率对应质量或面积。
  deliverable: 两个例子和 100 字解释。
  expected_evidence:
  - 两种归一化正确
  - 区分密度与概率
  evaluation:
    full_credit: 公式和解释均正确。
    partial_credit: 归一化正确但混淆密度与概率。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 8
- id: ex-2
  level: 基础
  question: 把潜变量生成器和样本评分器分别归入直接或间接路线，并比较各自还需解决的采样步骤。
  hint: 使用 G:Z→X 与 E:X→R。
  deliverable: 两行对照表。
  expected_evidence:
  - 映射方向和路线正确
  evaluation:
    full_credit: 两条路线与采样含义完整。
    partial_credit: 分类正确但未说明采样。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 17
- id: ex-3
  level: 进阶
  question: 分析“随机返回一条训练样本”的档案柜生成器：它为何能骗过只看训练样本的评价，又为何可能在留出似然上失败？
  hint: 区分训练复刻和对新数据赋高概率。
  deliverable: 150 字评审意见。
  expected_evidence:
  - 识别记忆
  - 解释留出评价
  evaluation:
    full_credit: 准确区分拟合、记忆与泛化。
    partial_credit: 只说过拟合未联系评价。
  citations:
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 25
  - source_id: mit6-7960-f24-lec14-cdb640b02e
    anchor:
      type: page
      value: 27
- id: ex-4
  level: 进阶
  question: 用文字拆解能量模型对数似然梯度中的数据项与模型期望项，并说明为什么需要模型样本形成对比。
  hint: 一个方向抬高数据概率，另一个处理归一化。
  deliverable: 双栏流程图。
  expected_evidence:
  - 两项角色正确
  - 解释模型采样
  evaluation:
    full_credit: 数据项、归一化项及对比关系完整。
    partial_credit: 知道正负样本但未说明归一化来源。
  citations:
