core_concepts:
- id: c1
  term: 线程
  claim_type: source_summary
  explanation: 线程是独立的串行执行，包含栈、寄存器和 PC；多个线程向操作系统暴露可并发安排的工作。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 4
- id: c2
  term: 抢占式调度
  claim_type: source_summary
  explanation: 每核定时器周期性触发中断，让内核从不主动让出的线程夺回控制并切换执行。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 11
- id: c3
  term: 调度状态机
  claim_type: source_summary
  explanation: Running 表示正在占用核心，Runnable 表示可运行但未占用核心，Sleeping 表示当前不能运行。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 12
- id: c4
  term: trapframe 与 context
  claim_type: source_summary
  explanation: trapframe 保存用户寄存器，context 保存内核寄存器；它们支持用户/内核与内核/调度器两层切换。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 15
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 16
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 19
- id: c5
  term: 每核调度器线程
  claim_type: source_summary
  explanation: 每个核心有独立调度器栈和 context，使退出线程可以离开自己的内核栈并允许其他核心安全接管。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 17
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 18
- id: c6
  term: 跨 swtch 的 p->lock
  claim_type: source_summary
  explanation: 把状态标记、context 保存和停止使用内核栈作为原子步骤，防止另一调度器过早运行同一进程。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 21
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 23
- id: c7
  term: 持锁 yield 死锁
  claim_type: source_summary
  explanation: 若线程持普通锁让出 CPU，另一线程可能在关闭中断时自旋等待该锁，使原拥有者无法重新运行释放锁。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 26
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 27
glossary:
- term: preemption
  definition: 通过定时器中断等机制暂停当前线程并把控制交给调度器。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 11
- term: trapframe
  definition: 保存用户态寄存器以便从内核返回用户态的结构。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 15
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 19
- term: context
  definition: 保存内核线程寄存器以便 swtch 后恢复的结构。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 15
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 19
- term: scheduler thread
  definition: 每个核心用于选择 Runnable 线程的专用内核执行上下文。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 17
common_misconceptions:
- misconception: 不运行的线程需要复制并保存其全部内存。
  correction: 内存仍在原处；切换主要保存寄存器、PC 和调度状态。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 13
- misconception: trapframe 和 context 保存同一层的状态。
  correction: trapframe 面向用户寄存器，context 面向内核线程切换。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 15
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 16
- misconception: p->lock 应当总由同一线程 acquire/release。
  correction: xv6 的调度交接刻意跨线程释放该锁，以保护跨 swtch 的不变量。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 21
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 23
- misconception: 持有任意自旋锁时 yield 都没有问题。
  correction: 另一个线程可能关闭中断后自旋，导致锁拥有者永远得不到 CPU。
  citations:
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 26
  - source_id: mit-6.s081-f21-lecture-11-material
    anchor:
      type: page
      value: 27
