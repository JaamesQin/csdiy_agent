common_misconceptions:
- misconception: 所有页故障都表示程序必须立即终止。
  correction: 页故障也可成为惰性分配、写时复制或按需分页的受控触发点。
  pages:
  - 10
  - 15
  - 16
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 10
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 15
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 16
- misconception: 写时复制 fork 在 fork 时仍复制全部物理页。
  correction: 它先把双方映射设为只读共享，写入时才复制。
  pages:
  - 15
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 15
- misconception: TLB 优化只需要更快硬件，不需要操作系统参与。
  correction: 材料列出 ASID、全局项和带地址的失效操作等软硬件协作机制。
  pages:
  - 21
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 21
