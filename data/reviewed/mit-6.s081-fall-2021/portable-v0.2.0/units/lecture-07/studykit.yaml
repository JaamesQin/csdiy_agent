practice:
- id: practice-01
  level: recall
  objective_ids:
  - obj-1
  question: 制作页故障诊断卡：故障地址、访问类型、故障指令位置/模式分别从哪里获得？
  hint: 查找 STVAL、SCAUSE、epc 与状态寄存器。
  deliverable: 四列诊断表。
  expected_evidence:
  - 地址与 STVAL 对应
  - 访问类型与 SCAUSE 对应
  - 位置和模式来源分开
  evaluation:
    full_credit: 四项信息及用途均准确。
    partial_credit: 能列出三个来源但混淆其中一个用途。
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 5
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 7
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 8
- id: practice-02
  level: trace
  objective_ids:
  - obj-2
  question: 追踪一次合法但尚未分配的堆地址首次写入：从页故障到安装物理页，再到指令重试；同时标出两个必须拒绝的地址边界。
  hint: 不要写代码，只写状态变化。
  deliverable: 6–8 步事件序列。
  expected_evidence:
  - 先故障后分配
  - 包含栈下方与过高地址检查
  evaluation:
    full_credit: 事件顺序和两个边界均清楚。
    partial_credit: 主流程正确但缺少一个边界检查。
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 10
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 12
- id: practice-03
  level: analysis
  objective_ids:
  - obj-3
  question: 比较零页与写时复制：初始共享条件、触发复制的事件以及复制后权限各是什么？
  hint: 两者都依赖只读映射与写故障，但共享内容和使用场景不同。
  deliverable: 两机制对照表。
  expected_evidence:
  - 区分零初始化与 fork 共享
  - 写故障触发复制
  evaluation:
    full_credit: 三项比较均准确且区分使用场景。
    partial_credit: 知道写故障触发复制，但未区分初始共享内容。
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 13
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 15
- id: practice-04
  level: design
  objective_ids:
  - obj-4
  question: 为一个有限大小用户栈设计一条概念保护规则：guard page 放在哪里、PTE 状态如何、故障处理器应如何区分越界与可增长情况？
  hint: 材料只给概念，不要求 xv6 实现。
  deliverable: 一张内存布局草图和三条规则。
  expected_evidence:
  - guard page 位于栈底边界
  - 无效映射触发故障
  - 说明增长与拒绝的区别
  evaluation:
    full_credit: 布局、触发条件与处理分支均合理且不超出材料。
    partial_credit: 能说明无效页，但缺少增长/拒绝分支。
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 14
