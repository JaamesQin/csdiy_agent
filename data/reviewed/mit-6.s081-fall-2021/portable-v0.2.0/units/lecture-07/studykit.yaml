core_concepts:
- id: concept-01
  term: 页故障证据三元组
  claim_type: source_summary
  explanation: 处理页故障需要知道故障虚拟地址、访问类型和故障发生位置/特权级。材料把地址放在 STVAL，把页故障类别编码在 SCAUSE，并通过保存的程序计数器与状态判断发生位置和模式。
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 5
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 6
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 7
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 8
- id: concept-02
  term: 惰性物理页分配
  claim_type: source_summary
  explanation: 传统 sbrk 可能提前分配永不访问的内存；惰性分配先扩展可用地址范围，在首次访问产生页故障时再安装物理页。处理器还必须拒绝越过用户栈或侵入内核范围的无效故障。
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 10
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 12
- id: concept-03
  term: 页故障驱动的内存优化
  claim_type: source_summary
  explanation: 只读零页让多个映射共享同一已清零物理页，写入时再复制；写时复制 fork 先共享只读页，写故障时复制；按需分页在故障时从文件装入；当工作集适合时，页表还可协助在磁盘与
    RAM 间换页。
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 13
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 15
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 16
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 17
- id: concept-04
  term: 虚拟内存作为可编程间接层
  claim_type: source_summary
  explanation: 无效 guard page 可捕获栈越界；mmap 把文件块映射为可用 load/store 访问的地址；ASID、全局项、局部失效和大页等机制用于减少
    TLB 管理成本。虚拟内存因此既是隔离工具，也是功能与性能接口。
  citations:
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 14
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 19
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 21
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 22
  - source_id: mit-6.s081-f21-lecture-07-material
    anchor:
      type: page
      value: 23
