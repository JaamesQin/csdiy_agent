practice:
- id: prac-01
  level: 入门
  question: 按四个维度比较单体与微内核，并说明为何没有普遍赢家。
  hint: 观察边界带来的双向影响。
  deliverable: 四行对照表。
  expected_evidence:
  - 单体协作直接。
  - 微内核缩小特权边界。
  - 结论依赖应用。
  evaluation:
    full_credit: 双向且有限定。
    partial_credit: 只列一方。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 1
- id: prac-02
  level: 理解
  question: 画出外部 pager 的缺页 IPC 与页映射路径。
  hint: 目标先暂停，pager 回复映射。
  deliverable: 六节点图。
  expected_evidence:
  - 故障 IPC。
  - pager 选页。
  - 内核映射并恢复。
  evaluation:
    full_credit: 顺序和角色准确。
    partial_credit: 缺少映射交接。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 2
- id: prac-03
  level: 应用
  question: 比较异步队列 RPC 与 L4 快速同步 RPC 的队列、复制、调度和调用。
  hint: 接收者常已等待。
  deliverable: 四维路径表。
  expected_evidence:
  - 同步直接会合。
  - 寄存器/页授权减少复制。
  - 组合调用减少穿越。
  evaluation:
    full_credit: 机制齐且不外推倍数。
    partial_credit: 只说更快。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 2
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 3
- id: prac-04
  level: 分析
  question: 追踪 L4/Linux fork，并区分 P1、Linux server 与 L4 的职责。
  hint: 语义在 server，原语在 L4。
  deliverable: 跨组件时间线。
  expected_evidence:
  - IPC 请求。
  - 创建 task/thread。
  - 分配、映射、复制页。
  - 设置 P2 并回复 P1。
  evaluation:
    full_credit: 顺序和职责正确。
    partial_credit: 混淆 server 与 L4。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 4
- id: prac-05
  level: 迁移
  question: 说明历史 getpid 与 AIM 结果能反驳什么、不能证明什么。
  hint: 可接受性能不等于架构选择充分。
  deliverable: 四句边界陈述。
  expected_evidence:
  - 区分微基准与整机基准。
  - 归属历史实现。
  - 不能推出应采用 L4。
  evaluation:
    full_credit: 证据层次和边界完整。
    partial_credit: 仅复述结果。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 4
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 5
