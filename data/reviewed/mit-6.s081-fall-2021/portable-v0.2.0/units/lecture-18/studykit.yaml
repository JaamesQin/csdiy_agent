core_concepts:
- id: cc-01
  term: 单体内核
  claim_type: source_summary
  explanation: 强抽象和内核内协作带来便利，也扩大高权限代码、复杂度和固化选择；不存在脱离应用的单一最佳组织。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 1
- id: cc-02
  term: 微内核
  claim_type: source_summary
  explanation: 微内核把多数 OS 功能移到用户态服务，内核主要保留地址空间、线程和 IPC。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 1
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 2
- id: cc-03
  term: L4 原语与 pager
  claim_type: source_summary
  explanation: task、thread、IPC 和页映射组合出用户态内存管理；缺页被 IPC 给外部 pager。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 2
- id: cc-04
  term: 快速同步 IPC
  claim_type: source_summary
  explanation: 同步无缓冲会合、寄存器消息、页授权和组合 RPC 调用减少队列、复制、调度及穿越；性能倍数限于历史实现。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 3
- id: cc-05
  term: L4/Linux OS server
  claim_type: source_summary
  explanation: 修改后的 Linux 内核作为用户态服务器，通过 IPC 提供语义，并借 L4 创建 task/thread、映射页和接收事件。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 3
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 4
- id: cc-06
  term: 微基准与整机基准
  claim_type: source_summary
  explanation: 历史 getpid 和 AIM 结果削弱因性能否决 L4 的理由，但不证明应采用 L4。
  citations:
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 4
  - source_id: mit-6.s081-f21-lecture-18-material
    anchor:
      type: page
      value: 5
glossary:
- term_en: Task
  term_zh: 任务/地址空间
  definition: L4 中承载页映射的地址空间抽象。
- term_en: Pager
  term_zh: 外部缺页处理者
  definition: 接收缺页 IPC 并决定页映射的任务。
- term_en: Synchronous IPC
  term_zh: 同步 IPC
  definition: 发送者与接收者直接会合的消息传递。
- term_en: OS server
  term_zh: 操作系统服务器
  definition: 在微内核上以用户进程提供兼容 OS 服务的程序。
common_misconceptions:
- misconception: 微内核普遍优于单体内核。
  correction: 组织取决于应用和设计目标。
- misconception: 同步 IPC 只是异步队列的别名。
  correction: 同步会合可直接交接控制而不排队。
- misconception: 历史基准证明应采用 L4。
  correction: 它们最多反驳性能必然不可接受。
