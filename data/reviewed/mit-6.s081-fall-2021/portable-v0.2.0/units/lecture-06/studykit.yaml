practice:
- id: prac-01
  level: 入门
  objective_ids:
  - obj-01
  question: 比较内联汇编 w_satp 示例和 .S 文件中的 csrwsatp, a1：谁选择寄存器、谁负责保存、编译器能否重排？
  hint: 查看内联汇编的约束列表与 .S 文件说明。
  deliverable: 三维对照表。
  expected_evidence:
  - 内联汇编可由约束让编译器选择寄存器并管理保存。
  - .S 文件直接指定 a1，保存与调用约定由程序员负责。
  - 独立汇编指令不由编译器重排。
  evaluation:
    full_credit: 三个维度均正确且没有把 clobber 当成输出。
    partial_credit: 能区分两种形式，但遗漏一个职责维度。
