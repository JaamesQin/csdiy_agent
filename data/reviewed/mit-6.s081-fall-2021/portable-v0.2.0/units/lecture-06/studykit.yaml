- id: cc-03
  term: 用户态到内核态转换
  term_en: User-to-kernel transition
  claim_type: source_summary
  explanation: 转换必须保存用户寄存器和 PC，建立内核栈与页表，再进入能区分系统调用、故障和中断的内核 C 代码，同时保证返回后用户状态不被意外扰动。
