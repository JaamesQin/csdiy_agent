    anchor:
      type: page
      value: 7
- id: cc-02
  term: RISC-V 特权状态
  term_en: Privileged RISC-V state
  claim_type: source_summary
  explanation: satp 指向页表根，stvec 指定陷阱入口，sepc 保存用户 PC，sscratch 提供转换临时状态；CSR 指令访问这些寄存器，sret
    返回用户空间。
  citations:
  - source_id: mit-6.s081-f21-lecture-06-material
