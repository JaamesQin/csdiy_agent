glossary:
- term_en: satp
  term_zh: satp
  definition: 保存页表根物理地址相关信息的特权寄存器。
- term_en: stvec
  term_zh: stvec
  definition: 保存监管态陷阱入口地址的寄存器。
- term_en: sepc
  term_zh: sepc
  definition: 陷阱发生时保存用户程序计数器的寄存器。
- term_en: Trapframe
  term_zh: 陷阱帧
  definition: 保存用户寄存器并携带进入内核所需状态的每进程结构。
- term_en: Trampoline
  term_zh: 蹦床页
  definition: 在地址空间转换边界执行保存和恢复工作的汇编代码。
common_misconceptions:
- misconception: ecall 会自动保存全部寄存器并切换内核页表。
  correction: 幻灯片明确说 ecall 只切换特权态并跳到 stvec；寄存器保存、换栈和换页表由 trampoline 完成。
  citations:
  - source_id: mit-6.s081-f21-lecture-06-material
    anchor:
      type: page
      value: 18
  - source_id: mit-6.s081-f21-lecture-06-material
    anchor:
      type: page
      value: 19
  - source_id: mit-6.s081-f21-lecture-06-material
    anchor:
      type: page
      value: 23
- misconception: trapframe 只用来保存系统调用参数。
  correction: 它还保存全部用户寄存器以及内核页表、内核栈、入口和 hart 标识等转换状态。
  citations:
  - source_id: mit-6.s081-f21-lecture-06-material
    anchor:
      type: page
      value: 21
  - source_id: mit-6.s081-f21-lecture-06-material
    anchor:
      type: page
      value: 22
- misconception: 进入内核后就已知道要执行 sys_write。
  correction: usertrap 先判断陷阱原因，系统调用分派再根据 a7 索引函数表。
  citations:
  - source_id: mit-6.s081-f21-lecture-06-material
    anchor:
      type: page
      value: 25
  - source_id: mit-6.s081-f21-lecture-06-material
    anchor:
      type: page
      value: 26
