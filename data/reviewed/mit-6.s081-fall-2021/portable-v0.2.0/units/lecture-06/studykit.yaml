core_concepts:
- id: cc-01
  term: 内联汇编与独立汇编源文件
  term_en: Inline assembly and assembly source
  claim_type: source_summary
  explanation: 内联汇编通过输出、输入和 clobber 约束让编译器继续协助分配与保存寄存器；独立 .S 文件直接指定寄存器，调用约定和保存责任由程序员承担。
  citations:
  - source_id: mit-6.s081-f21-lecture-06-material
