practice:
- id: practice-01
  level: classification
  objective_ids:
  - obj-1
  question: 把寄存器值、程序计数器、分支结果、L1 缓存行、TLB 项和加载延迟分成体系结构状态、微架构状态或可观察效应，并解释两项容易混淆的分类。
  hint: 以“是否属于程序规范结果”和“是否影响时间”为标准。
  deliverable: 六项分类表和两条解释。
  expected_evidence:
  - 寄存器/PC 与缓存/TLB 区分
  - 加载延迟作为观察效应处理
  evaluation:
    full_credit: 六项分类合理且解释了撤销与残留的差异。
    partial_credit: 主要分类正确但混淆一到两项。
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 1
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 2
- id: practice-02
  level: trace
  objective_ids:
  - obj-2
  question: 在不写代码的前提下，追踪一次缓存计时实验的抽象阶段：清除、被观察计算、重新加载、比较时间、形成推断。每一步写出可观察量和不能直接得出的结论。
  hint: 强调侧信道给出推断而非直接数据读。
  deliverable: 五阶段表。
  expected_evidence:
  - 阶段顺序正确
  - 区分缓存命中推断与直接内容
  evaluation:
    full_credit: 每阶段的状态与认识边界均清楚。
    partial_credit: 顺序正确但把计时误说成直接读取秘密。
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 2
- id: practice-03
  level: causal-analysis
  objective_ids:
  - obj-3
  question: 用“权限检查—非法推测加载—秘密控制缓存选择—异常退休—缓存计时”五个节点画 Meltdown 因果图，并指出若移除任一节点会怎样中断链条。
  hint: 保持为概念因果图，不填写真实地址、代码或参数。
  deliverable: 五节点图和五条阻断说明。
  expected_evidence:
  - 异常阻止体系结构提交但不清除缓存影响
  - 缓存选择承载信息
  evaluation:
    full_credit: 五节点关系及阻断条件完整准确。
    partial_credit: 主链正确但缺少一个阻断解释。
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
