core_concepts:
- id: concept-01
  term: 体系结构与微架构状态
  claim_type: source_summary
  explanation: 体系结构状态是程序员可见、由指令规范定义的结果；推测执行和缓存属于微架构实现。分支误预测或异常会撤销尚未退休指令对寄存器的结果，但缓存填充等微架构变化可能没有被同步撤销，因此“规范上不可见”不等于“时间上不可测”。
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 1
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 2
- id: concept-02
  term: 缓存计时侧信道
  claim_type: source_summary
  explanation: Flush+Reload 思路先让目标缓存行不在缓存，再运行被观察的计算，最后比较重新加载的时间。若加载明显更快，观察者可推断该地址在中间被访问。该方法读取的不是受保护数据本身，而是数据影响的缓存状态。
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 2
- id: concept-03
  term: Meltdown 因果链
  claim_type: source_summary
  explanation: 历史 Meltdown 场景假设用户页表仍映射内核但清除用户权限。处理器在异常退休前暂时让后续推测指令使用非法加载结果，并据其选择访问不同缓存行；异常最终阻止体系结构提交，但缓存差异可由计时恢复少量信息。成功条件并不稳定，笔记强调重试与缓存驻留会影响结果。
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 1
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 2
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 3
- id: concept-04
  term: 隔离恢复：KPTI 与硬件修复
  claim_type: source_summary
  explanation: 软件防御 KPTI/KAISER 在用户页表中不映射内核，系统调用出入时切换页表，代价可能包括额外切换与 TLB 影响。硬件防御在权限不允许的推测加载中不返回真实数据，从源头阻断编码。两者分别收紧地址空间暴露和微架构权限语义。
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 3
glossary:
- term: speculative execution（推测执行）
  definition: CPU 在条件尚未确定时预测并提前执行后续指令，以重叠延迟。
  pages:
  - 1
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 1
- term: retirement（退休）
  definition: 指令结果按顺序成为体系结构可见状态的阶段。
  pages:
  - 2
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 2
- term: micro-architectural state（微架构状态）
  definition: 缓存等实现细节状态，通常不在指令语义中直接暴露，但可影响时间。
  pages:
  - 2
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 2
- term: KPTI
  definition: 从用户页表移除内核映射、在内核出入时切换页表的软件隔离措施。
  pages:
  - 3
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 3
common_misconceptions:
- misconception: 误推测被撤销后，CPU 的所有内部状态都会恢复到完全相同。
  correction: 寄存器等体系结构结果会撤销，但缓存状态等微架构影响可能保留并可通过时间观察。
  pages:
  - 1
  - 2
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 1
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 2
- misconception: Flush+Reload 直接绕过页表读取受保护地址。
  correction: 它观察缓存加载时间；Meltdown 的泄漏链先让秘密影响缓存选择，再从时间差推断。
  pages:
  - 2
  - 3
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 2
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 3
- misconception: 部署一种历史缓解措施就能证明系统不存在任何微架构侧信道。
  correction: 笔记把 Meltdown 视为一类令人担忧的例子，并不提供对其他攻击的普遍保证。
  pages:
  - 3
  citations:
  - source_id: mit-6.s081-f21-lecture-22-material
    anchor:
      type: page
      value: 3
