limitations:
- 来源是 Fall 2021 官方课表显式链接的 2020 文本讲义，经确定性分页生成 PDF；页码是派生页码。
- 这是 Meltdown 的历史课程解释，不是 2026 年处理器、操作系统或云平台的当前漏洞/缓解状态指南。
- 学习活动保持防御性和非操作化，不提供可执行攻击代码、真实目标选择或参数调优。
- 笔记指出攻击成功条件和可靠性并不清楚；候选不会把实验性观察表述为确定保证。
