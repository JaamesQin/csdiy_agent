      value: 92
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 94
- id: c7
  term: 状态检查与栈回溯
  claim_type: source_summary
  explanation: GDB 可用 print/x 检查有类型表达式或原始内存，并用寄存器、栈帧和 backtrace 重建执行上下文。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
