core_concepts:
- id: c1
  term: 显式内存生命周期
  claim_type: source_summary
  explanation: C 把栈、静态区和堆的生命周期暴露给程序员；局部栈对象在函数返回后不能继续作为有效对象使用。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 13
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 33
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 34
- id: c2
  term: 指针与内存安全
  claim_type: source_summary
  explanation: 指针描述内存位置并允许直接读写；这种能力同时带来 use-after-free、double-free 和越界访问等风险。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 14
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 15
- id: c3
  term: 数组的连续布局
  claim_type: source_summary
  explanation: 数组元素在内存中连续排列，索引访问可理解为对首地址做按元素大小缩放的偏移后解引用。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 22
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 23
- id: c4
  term: 声明与定义
  claim_type: source_summary
  explanation: 声明告知名称和类型，定义则分配对象或给出函数实现；共享声明通常放在头文件中。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 37
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 47
- id: c5
  term: C 字符串契约
  claim_type: source_summary
  explanation: C 字符串是以空字符结尾的字符数组；缺少终止符会使依赖它的字符串函数越界读取。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 45
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 57
- id: c6
  term: 断点、条件断点与观察点
  claim_type: source_summary
  explanation: 断点按位置暂停，条件断点只在谓词成立时暂停，观察点则在表达式或地址内容变化时暂停。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 89
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
