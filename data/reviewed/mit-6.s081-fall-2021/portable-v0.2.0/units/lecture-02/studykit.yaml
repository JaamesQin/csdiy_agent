glossary:
- term: stack memory
  definition: 随函数调用建立、返回后可被复用的栈内存。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 13
- term: dangling pointer
  definition: 仍保存地址但所指对象生命周期已经结束的指针。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 14
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 34
- term: watchpoint
  definition: 在表达式值或指定地址内容发生变化时暂停执行的调试器机制。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 94
- term: backtrace
  definition: 按调用关系显示当前栈帧序列的调试器视图。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 102
common_misconceptions:
- misconception: 数组就是可自动扩容的列表。
  correction: C 数组长度固定，元素连续存放；越过边界不会自动扩容。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 22
- misconception: 只要函数返回了一个地址，该地址就一直有效。
  correction: 若地址指向函数的局部栈对象，函数返回后对象已结束生命周期。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 33
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 34
- misconception: step 与 next 完全相同。
  correction: 两者都按源码行前进，但 step 会进入被调函数，next 会跨过调用。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 82
- misconception: print 和 x 都只是以相同方式显示内存。
  correction: print 计算带类型的 C 表达式；x 按指定格式检查原始内存。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 99
