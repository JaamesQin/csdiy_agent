practice:
- id: p1
  level: 基础
  question: 给出一个含局部变量、静态变量和 malloc 对象的短函数，画出三类对象的生命周期，并标出函数返回后仍有效的对象。
  hint: 先按栈、静态区、堆分类，再判断释放责任。
  deliverable: 一张带时间轴的内存区域图。
  expected_evidence:
  - 正确区分三个存储区
  - 明确函数返回与 free 对有效性的影响
  evaluation:
    full_credit: 交付物覆盖全部预期证据，推理与页级来源一致，且清楚声明假设。
    partial_credit: 主要方向正确，但遗漏一个关键不变量、权衡或来源支撑。
  citations:
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
      type: page
      value: 13
  - source_id: mit-6.s081-f21-lecture-02-material
    anchor:
