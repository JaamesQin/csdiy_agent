    anchor:
      type: page
      value: 4
common_misconceptions:
- misconception: 文件名就是文件对象本身。
  correction: 名称是目录项；inode 才保存独立身份和元数据。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 1
- misconception: unlink 后已打开文件必须立即消失。
  correction: 打开引用仍可指向 inode，回收会延迟到链接与打开引用都消失。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 1
- misconception: 块缓存只有一个全局锁，因此不同块无法并行。
  correction: 全局锁保护缓存描述，单 buffer 锁保护内容，允许不同块并发。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 4
- misconception: 路径查找必须一路持有所有目录锁。
  correction: xv6 逐级释放锁，但通过 inode 引用保证对象不会被并发 unlink 立即回收。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 4
