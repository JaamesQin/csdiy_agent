core_concepts:
- id: c1
  term: inode 身份
  claim_type: source_summary
  explanation: 目录名不是文件的唯一身份；inode 保存独立于目录项的文件信息，使多个硬链接与打开后 unlink 成为可能。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 1
- id: c2
  term: 链接与打开引用
  claim_type: source_summary
  explanation: inode 只有在最后一个目录链接和最后一个打开引用都消失后才能安全释放。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 1
- id: c3
  term: xv6 磁盘布局
  claim_type: source_summary
  explanation: xv6 把磁盘视为块数组，固定区域存放 superblock、日志、inode、分配 bitmap 和文件/目录内容。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 2
- id: c4
  term: 元数据更新路径
  claim_type: source_summary
  explanation: 创建、写入和删除会更新不同的 inode、目录块、bitmap 与数据块；调用图把系统调用连接到这些物理更新。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 3
- id: c5
  term: 块缓存唯一副本
  claim_type: source_summary
  explanation: 缓存保证同一磁盘块在内存中只有一个缓存副本，避免并发调用者对不同副本做冲突修改。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 4
- id: c6
  term: 两级锁
  claim_type: source_summary
  explanation: bcache.lock 保护缓存目录/替换元数据，单个 buffer 的锁保护该块内容并允许其他块并行访问。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 4
- id: c7
  term: 引用先于锁
  claim_type: source_summary
  explanation: 路径查找在解锁当前目录后仍持有下一 inode 的引用，因此并发 unlink 不会立刻回收该 inode。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 4
glossary:
- term: inode
  definition: 保存文件类型、链接数、大小和数据块地址等信息的磁盘对象。
  citations:
  - source_id: mit-6.s081-f21-lecture-14-material
