prerequisites:
- topic: UNIX 文件描述符
  required_level: 知道 open/read/write/close 的基本接口语义。
- topic: 持久存储与块
  required_level: 理解磁盘按固定大小块读写。
- topic: 锁与引用计数
  required_level: 理解锁保护共享状态、引用计数延迟释放对象。
outline:
- order: 1
  topic: UNIX 文件系统 API 与 inode
  purpose: 从 open/link/unlink 语义推导文件身份、链接计数、打开引用与延迟回收。
  anchors:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
