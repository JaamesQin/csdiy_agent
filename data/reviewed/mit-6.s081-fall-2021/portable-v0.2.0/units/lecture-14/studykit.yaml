      value: 1
- order: 2
  topic: 存储介质与磁盘布局
  purpose: 解释块大小、顺序/随机访问差异、superblock、inode、bitmap 与数据块布局。
  anchors:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 2
- order: 3
  topic: 创建、写入与删除路径
  purpose: 沿 xv6 调用图把高级文件操作映射到 inode、目录、bitmap 与数据块写入。
  anchors:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 3
- order: 4
  topic: 块缓存与两级锁
  purpose: 说明缓存唯一副本不变量、bcache.lock 与 buffer lock 的不同保护范围。
  anchors:
  - source_id: mit-6.s081-f21-lecture-14-material
    anchor:
      type: page
      value: 4
- order: 5
