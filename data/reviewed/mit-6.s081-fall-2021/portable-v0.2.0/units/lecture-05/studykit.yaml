practice:
- id: p1
  level: 基础
  question: 给出“进入函数内部”和“跳过函数调用”两个目标，分别选择 GDB 命令并解释选择。
  hint: 在 step 与 next 之间比较，再考虑是否需要指令级版本。
  deliverable: 命令选择表。
  expected_evidence:
  - 四种单步命令的粒度与进入规则正确
  evaluation:
    full_credit: 交付物覆盖全部预期证据，推理与页级来源一致，且清楚声明假设。
    partial_credit: 主要方向正确，但遗漏一个关键不变量、权衡或来源支撑。
  citations:
