prerequisites:
- topic: 命令行与 make
  required_level: 能够在不同终端启动进程并阅读构建输出。
- topic: C 函数调用
  required_level: 理解函数、局部变量和返回的基本概念。
- topic: 源码与机器指令的区别
  required_level: 知道一行源码可能对应多条指令即可。
