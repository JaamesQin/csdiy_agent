core_concepts:
- id: c1
  term: 调试会话编排
  claim_type: source_summary
  explanation: 课程环境通过 .gdbinit 连接 QEMU；QEMU 与 GDB 分别运行在两个终端中。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 11
- id: c2
  term: 源码级与指令级单步
  claim_type: source_summary
  explanation: step/next 按源码行前进并在是否进入调用上不同；stepi/nexti 在机器指令粒度工作。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 15
- id: c3
  term: 运行终点
  claim_type: source_summary
  explanation: continue 等待断点或中断，finish 等待当前函数返回，advance 前进到指定位置。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 19
- id: c4
  term: 条件化停止
  claim_type: source_summary
  explanation: 条件断点只在谓词满足时停下，适合跳过大量无关迭代。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 22
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 25
- id: c5
  term: 观察点
  claim_type: source_summary
  explanation: 观察点把停止条件绑定到表达式值变化或具体地址内容变化，可用于捕获首次写坏状态。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 27
- id: c6
  term: 类型化与原始检查
  claim_type: source_summary
  explanation: print 计算 C 表达式并按类型展示，x 按格式读取原始内存；二者回答不同问题。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 32
- id: c7
  term: 调用上下文
  claim_type: source_summary
  explanation: 寄存器、当前栈帧和 backtrace 共同描述程序为何到达当前执行位置。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 35
glossary:
- term: breakpoint
  definition: 执行到指定位置时暂停的调试器停止点。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 22
- term: conditional breakpoint
  definition: 仅在附加条件成立时触发的断点。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 25
- term: watchpoint
  definition: 在表达式或地址内容发生指定访问时暂停的机制。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 27
- term: stack frame
  definition: 一次函数调用的当前执行上下文，可由 info frame 检查。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 35
common_misconceptions:
- misconception: next 会进入被调函数。
  correction: next 跨过调用；step 才会进入。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 15
- misconception: 观察点和断点都只绑定代码位置。
  correction: 观察点绑定表达式或地址的读写事件。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 22
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 27
- misconception: x 和 print 的输出语义相同。
  correction: x 查看原始内存，print 求值有类型的表达式。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 32
- misconception: 标题出现 RISC-V 就说明当前 PDF 充分讲解了 RISC-V 调用约定。
  correction: 准备材料实际是旧版 GDB 讲义；不能据此补写未出现的调用约定细节。
  citations:
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 1
  - source_id: mit-6.s081-f21-lecture-05-material
    anchor:
      type: page
      value: 42
