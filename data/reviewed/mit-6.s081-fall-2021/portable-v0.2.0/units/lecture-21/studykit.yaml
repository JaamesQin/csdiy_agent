core_concepts:
- id: cc-01
  term: 分层封装
  claim_type: source_summary
  explanation: Ethernet、IP 和 UDP/TCP 分别承担局域网交付、路由/协议分派和应用端口分派；高层头部嵌入低层载荷。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 1
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 2
- id: cc-02
  term: ARP
  claim_type: source_summary
  explanation: ARP 广播目标 IP 查询，由拥有该 IP 的主机返回 Ethernet 地址。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 1
- id: cc-03
  term: 内核网络栈路径
  claim_type: source_summary
  explanation: 入站解析验证并剥头，出站加头；队列解耦 NIC、网络线程与应用。这是典型而非唯一安排。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 2
- id: cc-04
  term: DMA 描述符环
  claim_type: source_summary
  explanation: 驱动准备循环缓冲指针，NIC DMA 包到主存，使传输与 CPU 计算可并行。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 2
- id: cc-05
  term: 接收活锁
  claim_type: source_summary
  explanation: 在论文场景中，持续接收和部分处理饿死完成路径，CPU 很忙但完成包变少。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 2
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 3
- id: cc-06
  term: 中断转轮询控制
  claim_type: source_summary
  explanation: 低负载用中断唤醒，高负载在线程中轮询；配额或下游反馈为完成工作保留资源。通用原则不是任意系统的充分条件。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 3
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 4
glossary:
- term_en: Encapsulation
  term_zh: 封装
  definition: 高层包作为低层载荷传输。
- term_en: DMA ring
  term_zh: DMA 环
  definition: NIC 与驱动共享的循环缓冲描述符集合。
- term_en: Livelock
  term_zh: 活锁
  definition: 系统持续执行却无法完成有用进展。
- term_en: Backpressure
  term_zh: 背压
  definition: 下游接近满时通知上游减速或暂停。
common_misconceptions:
- misconception: IP 地址直接选择应用。
  correction: 端口才把传输层数据分派给应用。
- misconception: 更大队列能解决持续过载。
  correction: 队列只吸收短突发，不能消除长期速率失配。
- misconception: CPU 忙说明完成吞吐高。
  correction: 活锁中 CPU 忙于最终被丢弃的部分工作。
