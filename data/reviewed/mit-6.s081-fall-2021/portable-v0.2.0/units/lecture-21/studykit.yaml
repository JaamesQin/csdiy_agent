practice:
- id: prac-01
  level: 入门
  question: 标注 Ethernet/IP/UDP 包各地址和 ARP 的职责。
  hint: 链路、跨网、协议、应用。
  deliverable: 五行表。
  expected_evidence:
  - Ethernet 选局域网目标。
  - IP 路由到主机。
  - 协议号与端口继续分派。
  - ARP 解析链路地址。
  evaluation:
    full_credit: 层次准确。
    partial_credit: 混淆 IP 与端口。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 1
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 2
- id: prac-02
  level: 理解
  question: 画出 NIC DMA ring 到 socket 队列和应用的入站路径。
  hint: 标注执行主体与缓冲目的。
  deliverable: 路径图。
  expected_evidence:
  - DMA ring。
  - 逐层解析剥头。
  - socket 队列解耦应用。
  - 注明典型结构。
  evaluation:
    full_credit: 路径和范围完整。
    partial_credit: 缺少缓冲角色。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 2
- id: prac-03
  level: 应用
  question: 解释过载时为什么接收工作增加却完成吞吐下降。
  hint: 观察最终被丢弃的部分处理。
  deliverable: 五节点因果链。
  expected_evidence:
  - 输入饿死完成路径。
  - 部分工作被丢弃。
  - CPU 忙但进展下降。
  evaluation:
    full_credit: 反馈环完整且限于论文场景。
    partial_credit: 只说中断多。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 2
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 3
- id: prac-04
  level: 分析
  question: 模拟稀疏与持续到包时的中断—轮询状态轨迹。
  hint: 无待处理包才重开中断。
  deliverable: 两条状态轨迹。
  expected_evidence:
  - 中断唤醒并关闭。
  - 线程轮询完整处理。
  - 无包时重开并睡眠。
  evaluation:
    full_credit: 两种负载顺序正确。
    partial_credit: 重开时机错误。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 3
- id: prac-05
  level: 迁移
  question: 比较配额与队列反馈，并有条件迁移到多阶段系统。
  hint: 预算与下游状态是不同信号。
  deliverable: 对照表加迁移例。
  expected_evidence:
  - 配额限制输入批次。
  - 反馈随队列容量减速。
  - 复杂拓扑会传播阻塞。
  - 原则非充分条件。
  evaluation:
    full_credit: 机制和边界完整。
    partial_credit: 只推荐一种。
  citations:
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 3
  - source_id: mit-6.s081-f21-lecture-21-material
    anchor:
      type: page
      value: 4
