  level: 推导
  question: 对 x_out=W x_in，给定行向量 g_out，写出输入梯度并描述权重梯度结构。
  hint: 先写出相关局部公式或计算图，再检查维度与符号。
  deliverable: 一份含推导或解释的书面答案
  expected_evidence:
  - g_in=g_out W；权重梯度是与 W 同形的外积，由上游梯度各输出分量与输入各分量配对。
  evaluation:
    criterion: 答案须与 expected_evidence 一致，并引用对应讲义页。
