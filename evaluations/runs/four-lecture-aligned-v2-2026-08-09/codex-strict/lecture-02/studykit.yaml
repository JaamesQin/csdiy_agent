  level: 概念检查
  question: 解释病态曲率为何使固定学习率梯度下降发生之字形振荡，并给出一个讲义中的缓解思路。
  hint: 先写出相关局部公式或计算图，再检查维度与符号。
  deliverable: 一份含推导或解释的书面答案
  expected_evidence:
  - 不同方向曲率差异大时，稳定所需步长受陡峭方向限制，而平缓方向进展慢；动量可平滑振荡并积累一致方向。
  evaluation:
    criterion: 答案须与 expected_evidence 一致，并引用对应讲义页。
- id: p2
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 34
  level: 推导
  question: 设 z∈R^m、u∈R^p、x∈R^n，写出 dz/dx 的链式法则和各矩阵形状。
  hint: 先写出相关局部公式或计算图，再检查维度与符号。
  deliverable: 一份含推导或解释的书面答案
  expected_evidence:
  - dz/dx=(dz/du)(du/dx)，形状为 (m×p)(p×n)=m×n。
  evaluation:
    criterion: 答案须与 expected_evidence 一致，并引用对应讲义页。
