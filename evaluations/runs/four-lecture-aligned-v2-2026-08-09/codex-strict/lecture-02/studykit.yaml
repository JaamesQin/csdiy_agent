      value: 55
  level: 图分析
  question: 同一中间变量分成两支后再汇合，且两支都使用共享参数 θ。反向传播时两类梯度如何处理？
  hint: 先写出相关局部公式或计算图，再检查维度与符号。
  deliverable: 一份含推导或解释的书面答案
  expected_evidence:
  - 对中间变量的梯度把两条路径贡献相加；对 θ 的梯度也把每个使用位置的贡献相加。
  evaluation:
    criterion: 答案须与 expected_evidence 一致，并引用对应讲义页。
- id: p5
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 66
  level: 应用
  question: 固定分类器参数，想寻找使第 j 类得分高且不过度噪声化的输入，应写什么目标并更新哪个变量？
  hint: 先写出相关局部公式或计算图，再检查维度与符号。
  deliverable: 一份含推导或解释的书面答案
  expected_evidence:
  - 优化输入 x：argmax_x(y_j+λR(x))，根据目标关于 x 的梯度做上升；模型参数保持固定。
  evaluation:
    criterion: 答案须与 expected_evidence 一致，并引用对应讲义页。
