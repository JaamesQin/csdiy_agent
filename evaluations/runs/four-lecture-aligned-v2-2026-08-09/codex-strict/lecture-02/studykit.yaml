  level: 综合核验
  question: 讲义两层网络例题从 x=(1.0,0.1) 出发。列出核验一次训练迭代的顺序，并解释 η=−0.2 的符号。
  hint: 先写出相关局部公式或计算图，再检查维度与符号。
  deliverable: 一份含推导或解释的书面答案
  expected_evidence:
  - 依次复算 x1、x2、x3 与损失，再从损失回传各层梯度，最后更新 W1、W0；例题采用加 η 倍梯度且 η 为负，因此方向仍是梯度下降。讲义给出的前向值约为
    x1=(0.7,0.3)、x2=(0.604,0.291)、x3=0.313、损失 0.017。
  evaluation:
    criterion: 答案须与 expected_evidence 一致，并引用对应讲义页。
