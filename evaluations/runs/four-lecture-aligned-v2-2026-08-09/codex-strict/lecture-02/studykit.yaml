core_concepts:
- explanation: 训练选择参数 θ，使样本损失之和最小：θ*=argmin_θ Σ_i L(f_θ(x⁽ⁱ⁾),y⁽ⁱ⁾)。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 5
  id: cc1
  term: 经验风险最小化
  claim_type: explanation
- explanation: 第 k 步沿负梯度更新 θ：θ^(k+1)=θ^k−η∇_θJ(θ^k)。学习率 η 决定局部步长。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 8
  id: cc2
  term: 梯度下降
  claim_type: explanation
- explanation: 讲义把历史方向 m^t 加入更新：θ^(t+1)=θ^t−η∇f(θ^t)−αm^t，以平滑方向并加速一致方向。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 10
  id: cc3
  term: 动量
  claim_type: explanation
- explanation: 狭长曲率会导致振荡，鞍点附近梯度小但并非极小值；深层复合还会造成梯度消失或爆炸。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 12
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 16
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 19
  id: cc4
  term: 训练地形困难
  claim_type: explanation
- explanation: 归一化与残差连接改善信号传播；梯度裁剪限制梯度范数；ReLU 为 max(0,z)，其正区间导数不衰减。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 20
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 22
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 24
  id: cc5
  term: 稳定化手段
  claim_type: explanation
- explanation: 标量对向量的梯度写成行向量；向量输出关于向量输入的 Jacobian 为“输出维×输入维”。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 32
  id: cc6
  term: Jacobian 约定
  claim_type: explanation
- explanation: 若 x→u→z，则 dz/dx=(dz/du)(du/dx)，维度为 (m×p)(p×n)=m×n。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 34
  id: cc7
  term: 矩阵链式法则
  claim_type: explanation
- explanation: 计算图把共享的链式乘积只计算一次，再把上游梯度传给多个局部导数。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 36
  id: cc8
  term: 反向传播的复用
  claim_type: explanation
- explanation: 对层 x_out=f(x_in,θ)，先求局部 Jacobian L^x、L^θ，再计算 g_in=g_out L^x 与 dJ/dθ=g_out
    L^θ。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 38
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 41
  id: cc9
  term: 层的反向接口
  claim_type: explanation
- explanation: 训练迭代先前向保存中间量，再反向累积梯度，最后使用优化器更新参数。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 42
  id: cc10
  term: 前向—反向—更新
  claim_type: explanation
- explanation: 批损失是样本损失的平均，相应参数梯度也是逐样本梯度的平均。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 45
  id: cc11
  term: 批处理梯度
  claim_type: explanation
- explanation: 若 x_out=W x_in，则输入梯度为 g_in=g_out W；权重梯度由上游梯度与输入形成外积。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 46
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 48
  id: cc12
  term: 线性层梯度
  claim_type: explanation
- explanation: 一个节点流向多支时，回传贡献相加；同一参数在多处使用时，其各处参数梯度也相加。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 53
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 55
  id: cc13
  term: 分支与参数共享
  claim_type: explanation
- explanation: 只要目标是标量，反向传播可计算它对计算图中任意节点或边变量的梯度，而不局限于模型参数。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 61
  id: cc14
  term: 可微编程
  claim_type: explanation
- explanation: 可固定模型并求 argmax_x(y_j+λR(x))，再按输入梯度做上升；正则项约束所求输入。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 66
  id: cc15
  term: 输入优化
  claim_type: explanation
glossary:
- term: 上游梯度
  definition: 损失关于当前层输出的导数 g_out。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 41
- term: 局部 Jacobian
  definition: 当前运算输出关于该运算输入或参数的导数矩阵。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 38
- term: 梯度裁剪
  definition: 当梯度范数过大时按阈值缩放梯度。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 22
- term: 参数共享
  definition: 计算图的多个位置引用同一参数，反向时贡献需累加。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 55
common_misconceptions:
- misconception: 梯度接近零就一定到了局部最小值。
  correction: 鞍点也可能具有零梯度，需要结合曲率或邻域行为判断。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 16
- misconception: 分支反向时任选一条路径即可。
  correction: 同一变量经多条路径影响损失时，各路径梯度贡献必须求和。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 53
- misconception: 共享参数的梯度只算一次使用位置。
  correction: 每个使用位置都产生贡献，最终对同一参数累加。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 55
- misconception: 讲义数值例题中的正号更新与通常梯度下降矛盾。
  correction: 例题把学习率写成 η=−0.2，因此“加 η 倍梯度”与沿负梯度方向更新一致；必须连同符号约定阅读。
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 72
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 80
