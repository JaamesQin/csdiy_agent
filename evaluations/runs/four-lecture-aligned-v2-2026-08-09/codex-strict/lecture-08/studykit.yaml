core_concepts:
- id: C1
  term: 局部性限制
  claim_type: source_summary
  explanation: 小卷积核只连接局部邻域；在示例的浅层网络中，相距很远的 x1 与 x7 没有同时接收二者的节点。attention 提供跨 token
    的动态信息混合。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 4
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 5
- id: C2
  term: Token 与 tokenization
  claim_type: source_summary
  explanation: token 是封装信息的神经元向量。通用 tokenization 策略是把输入切块，再把每块投影成向量；课件展示了图像 patch、文本
    byte pair 和声音片段。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 11
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 14
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 15
  formula:
    status: resolved
    latex: t\in\mathbb{R}^{d},\qquad T\in\mathbb{R}^{N\times d}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 14
    warnings: []
- id: C3
  term: Token mixing
  claim_type: source_summary
  explanation: 输出 token 的每个代码位置使用同一组标量权重汇聚输入 tokens；W 左乘 T，因此混合 token 轴。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 17
  formula:
    status: resolved
    latex: T_{out}[i,:]=\sum_{j=1}^{N}w_{ij}T_{in}[j,:],\qquad T_{out}=WT_{in}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 17
    warnings: []
- id: C4
  term: Token-wise nonlinearity
  claim_type: source_summary
  explanation: 共享非线性 F_θ 独立作用于每个 token；通常它是 MLP，且这一步本身不跨 token 传递信息。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 18
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 19
  formula:
    status: resolved
    latex: T_{out}=\begin{bmatrix}F_\theta(T_{in}[0,:])\\\vdots\\F_\theta(T_{in}[N-1,:])\end{bmatrix}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 18
    warnings: []
- id: C5
  term: Token net 的图视角
  claim_type: source_summary
  explanation: token net 交替执行线性 token 混合与逐 token 更新；GNN 的 AGGREGATE/UPDATE 提供对应视角，Transformer
    可看作完全图上的 GNN。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 20
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 22
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 23
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 24
- id: C6
  term: 数据依赖 attention
  claim_type: source_summary
  explanation: 与直接学习固定连接矩阵 W 不同，attention 使用由当前输入构造的矩阵 A，因此可依 query 内容动态选择要汇聚的 tokens。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 20
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 29
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 32
- id: C7
  term: Scaled dot-product self-attention
  claim_type: source_summary
  explanation: 同一输入 token 集产生 Q、K、V；QK^T 给出所有 query-key 匹配，缩放并 softmax 后得到 A，再由 AV
    汇聚 values。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 29
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 33
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
  formula:
    status: resolved
    latex: Q=T_{in}W_q^T,\;K=T_{in}W_k^T,\;V=T_{in}W_v^T,\quad A=\operatorname{softmax}\left(\frac{QK^T}{\sqrt
      m}\right),\quad T_{out}=AV
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 34
    warnings:
    - softmax 轴依矩阵约定；不把课件公式映射为特定框架参数。
- id: C8
  term: Multihead self-attention
  claim_type: source_summary
  explanation: k 个 head 分别计算 attention，按同一 token 行拼接成 N×kv 表示，再用 W_MSA 映回 d 维。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 37
  formula:
    status: resolved
    latex: T_{out}^{i}=\operatorname{attn}^{i}(T_{in}),\quad \bar T_{out}\in\mathbb{R}^{N\times
      kv},\quad T_{out}=\bar T_{out}W_{MSA},\;W_{MSA}\in\mathbb{R}^{kv\times d}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 37
    warnings: []
- id: C9
  term: ViT block
  claim_type: source_summary
  explanation: 课件图中的 block 依次包含 token norm、MSA、残差加法、token norm、逐 token MLP、残差加法，并重复
    L 次。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 38
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 39
- id: C10
  term: Permutation equivariance
  claim_type: source_summary
  explanation: 逐 token 层和 attention 都对 token 行置换等变，它们的组合也等变：输入重排会导致输出作同一重排，而非输出保持逐项不变。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 35
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 41
  formula:
    status: resolved
    latex: \operatorname{transformer}(\operatorname{permute}(T_{in}))=\operatorname{permute}(\operatorname{transformer}(T_{in}))
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 41
    warnings: []
- id: C11
  term: Positional encoding
  claim_type: source_summary
  explanation: 向 token 代码附加位置，使模型能区分相同内容处于不同坐标的情况。图像示例用多尺度正弦值表示 x、y，并拼接成 p。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 42
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 43
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 44
  formula:
    status: resolved
    latex: p_x=[\sin(x),\sin(x/B),\sin(x/B^2),\ldots,\sin(x/B^P)]^T,\quad p_y=[\sin(y),\sin(y/B),\ldots,\sin(y/B^P)]^T,\quad
      p=[p_x;p_y]
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 44
    warnings:
    - 只转录第44页可见的 sine 分量。
- id: C12
  term: Causal attention
  claim_type: source_summary
  explanation: causal mask 删除从当前位置通向未来位置的信息边；它允许单次前向同时训练多个 next-token 目标，多层仍保持因果可达性。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 48
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 49
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 52
- id: C13
  term: Image-to-text cross-attention
  claim_type: source_summary
  explanation: 图像编码器以 self-attention 处理视觉 tokens；文本解码器以 causal self-attention 处理文本，并用文本
    queries 对图像 keys/values 做 cross-attention。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 54
glossary:
- term: query
  definition: 表达当前 token 想匹配的信息。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 29
- term: key
  definition: 与 query 计算匹配分数的表示。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 29
- term: value
  definition: 按 attention 权重被汇聚的内容表示。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 29
- term: head
  definition: 一套独立参数化 Q/K/V 的注意力路径。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 37
- term: causal mask
  definition: 阻止当前位置获取未来 token 信息的连接掩码。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 52
- term: cross-attention
  definition: query 与 key/value 来自不同 token 集的注意力。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 54
common_misconceptions:
- misconception: Token 是单个标量。
  correction: 本讲 token 是神经元向量。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 11
- misconception: A 是与输入无关的自由参数。
  correction: A 由输入相关的 Q/K 匹配动态构造。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 20
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
- misconception: 等变就是不变。
  correction: 输入换序时输出随同换序。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 41
- misconception: 多头共享同一 Q/K/V 函数。
  correction: 每个 head 有各自的参数化函数。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 37
- misconception: causal mask 使训练必须完全串行。
  correction: 一次矩阵计算可同时监督多个预测位置。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
