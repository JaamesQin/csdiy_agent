      value: 62
- id: P4
  level: 设计
  question: 设计一个保留细小物体边界的图像到分割图网络。比较纯编码器—解码器、U-Net 和残差块组合，并明确每条跳跃路径是拼接还是相加。
  hint: 用瓶颈路径表达上下文，用镜像跳跃传递高分辨率信息。
  deliverable: 架构图、每个路径的张量作用和 200 字理由。
  expected_evidence:
  - 包含上下采样
  - U-Net 镜像拼接正确
  - 残差加法位置明确
  evaluation:
    criteria:
    - 结构正确
    - 任务匹配
    - 融合算子清楚
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
