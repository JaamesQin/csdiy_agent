practice:
- id: P1
  level: 概念
  question: 给一个输入平移两格的例子，分别画出等变映射与不变分类读出的输出，并解释差异。
  hint: 等变输出保留空间拓扑；不变读出只保留整体类别。
  deliverable: 两组输入输出图与 100 字解释。
  expected_evidence:
  - 等变输出同向平移
  - 不变读出保持类别
  - 明确二者对应不同任务
  evaluation:
    criteria:
    - 概念准确
    - 图示一致
    - 引用充分
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 23
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 52
- id: P2
  level: 结构
  question: 为三通道输入、两个输出特征图画出局部卷积连接。说明哪些权重跨位置共享、哪些参数属于不同输出通道。
  hint: 先画一个输出位置，再复制到相邻位置。
  deliverable: 带颜色标记的连接图和参数说明。
  expected_evidence:
  - 输入通道被组合
  - 输出滤波器彼此区分
  - 相对空间位置权重共享
  evaluation:
    criteria:
    - 通道关系
    - 共享关系
    - 局部性
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 27
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
