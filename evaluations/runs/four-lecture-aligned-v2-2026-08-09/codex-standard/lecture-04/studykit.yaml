  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 31
- id: P3
  level: 分析
  question: 在细边界分割任务中比较步幅 2、扩张卷积和普通卷积堆叠。列出感受野、输出分辨率、混叠风险和计算成本的相对变化。
  hint: 不要把核采样稀疏与输出采样稀疏混为一谈。
  deliverable: 四列比较表及推荐方案。
  expected_evidence:
  - 步幅会下采样
  - 扩张保持输出位置网格
  - 指出步幅示例的混叠风险
  evaluation:
    criteria:
    - 维度完整
    - 推理对应证据
    - 推荐自洽
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 58
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
