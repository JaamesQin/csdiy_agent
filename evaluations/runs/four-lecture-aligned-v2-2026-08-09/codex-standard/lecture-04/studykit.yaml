- id: P5
  level: 综合
  question: 任务要求任意连续二维坐标处返回颜色，而且颜色取决于绝对位置。比较 MLP、带位置输入的卷积和神经场表述；把课堂支持与个人设计推断分别标注。
  hint: 先判断是否存在固定输入网格，再判断是否需要绝对位置。
  deliverable: 决策树、方案表和证据/推断标签。
  expected_evidence:
  - 连续坐标需求被识别
  - 位置输入目的正确
  - 未扩展课堂未给出的训练结论
  evaluation:
    criteria:
    - 决策清晰
    - 证据边界
    - 方案适配
