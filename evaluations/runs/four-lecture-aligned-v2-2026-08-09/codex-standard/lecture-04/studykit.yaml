core_concepts:
- id: C1
  term: 受约束假设空间
  claim_type: source_summary
  explanation: 架构把所有可想象映射限制为更小的可表示集合。若真实映射仍在集合中，结构约束可与增加数据一样帮助排除不合适解；但架构也要可优化、可并行且计算可承受。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 6
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 8
- id: C2
  term: 逼近与优化的实验耦合
  claim_type: source_summary
  explanation: 课堂展示不同网络拟合图像的差异，同时明确提醒：结果可能来自逼近能力，也可能来自优化能力，实际实验通常无法把二者完全拆开。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 9
- id: C3
  term: 语义分割的局部上下文矛盾
  claim_type: source_summary
  explanation: 逐像素输出要求高空间分辨率，而过小图块又缺少辨认物体所需的上下文。较大、重叠且共享处理的窗口兼顾密集输出和上下文。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 18
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 19
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 22
- id: C4
  term: 平移等变
  claim_type: source_summary
  explanation: 若每个位置都应用相同局部函数，移动输入后所得输出会相应移动。它描述输入变化如何传递到输出，不表示输出数值或位置保持不变。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 23
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 36
- id: C5
  term: 卷积即受约束线性层
  claim_type: source_summary
  explanation: 卷积核对邻域做共享加权组合；从矩阵角度看，这是一种具有重复结构的受约束线性层，因此参数少于任意稠密连接。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 24
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 25
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 32
- id: C6
  term: 多输入与多输出通道
  claim_type: source_summary
  explanation: 神经网络卷积把各输入通道的局部响应组合起来，并用一组滤波器产生多个输出特征图；每个输出通道对应一个学习到的响应图。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 31
- id: C7
  term: 五种卷积视角
  claim_type: source_summary
  explanation: 卷积可同时理解为平移等变映射、滑动块处理、图像滤波、参数共享，以及处理可变尺寸张量的方法。这些不是五种不同操作，而是同一结构的五种解释。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 34
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 36
- id: C8
  term: 感受野随深度扩大
  claim_type: source_summary
  explanation: 卷积单元只看局部输入，但层层复合会让更深单元依赖更大的原始区域；逐点非线性不改变空间依赖范围，下采样会更快扩大相对感受野。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 37
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 62
- id: C9
  term: 两类池化
  claim_type: source_summary
  explanation: 空间池化可降低对局部平移的敏感度并常伴随降采样；跨通道池化可以把不同方向等特征响应合并，从而获得另一类不变性。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 50
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 52
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 53
- id: C10
  term: 步幅与混叠
  claim_type: source_summary
  explanation: 步幅操作把卷积或池化和下采样合在一起，可降低内存与计算；页面示例也显示步幅增大可能引入混叠并损失边界。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 58
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 59
- id: C11
  term: 扩张卷积
  claim_type: source_summary
  explanation: 扩张卷积拉开滤波器采样点而不是稀疏输出位置，因此用较少参数覆盖较大的感受野，并与步幅下采样形成不同取舍。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 60
- id: C12
  term: 空间输出与 U-Net
  claim_type: source_summary
  explanation: 编码器通过卷积和下采样提炼压缩表示，解码器上采样生成空间输出。U-Net 把镜像尺度的早期激活按通道拼接到解码端，以补充瓶颈丢失的高频细节。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 67
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 68
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 69
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 70
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 71
- id: C13
  term: ResNet 残差路径
  claim_type: source_summary
  explanation: ResNet 把跳跃输入与变换块输出相加，使块表示对输入的修正；若维度不一致可在线性映射后相加。它不同于 U-Net 的跨尺度拼接。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 71
- id: C14
  term: 位置编码与神经场
  claim_type: source_summary
  explanation: 当绝对位置决定输出时，可不用平移不变架构，或把位置加入卷积输入。神经场进一步以连续坐标查询颜色等值；NeRF 页面把更高维坐标映射为颜色和体密度。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 76
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 77
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 78
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 79
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 80
glossary:
- term: 假设空间
  definition: 某一架构能够表示的候选函数集合。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 6
- term: 平移等变
  definition: 输入发生平移时输出按同样方式平移。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 23
- term: 权重共享
  definition: 在不同空间位置复用同一局部权重。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 27
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 29
- term: 特征图
  definition: 一个学习滤波器在各空间位置形成的响应通道。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 31
- term: 感受野
  definition: 能够影响指定输出单元的输入位置集合。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 37
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 62
- term: 步幅操作
  definition: 以大于一的位置间隔应用卷积或池化，并同时下采样。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 58
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 59
- term: 扩张卷积
  definition: 让核内采样点间隔增大、以扩大覆盖范围的卷积。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 60
- term: 位置编码
  definition: 把位置信息作为额外输入，使模型能够响应绝对位置。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 76
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 77
- term: 神经场
  definition: 输入连续坐标并返回该坐标处场值的神经表示。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 78
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 79
common_misconceptions:
- misconception: 卷积会自动让任何输出对平移不变。
  correction: 卷积首先提供平移等变；池化或任务读出才可能形成某种不变性。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 23
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 52
- misconception: 图块越小，语义分割越好。
  correction: 小图块提高定位分辨率但削弱语义上下文，因此需要重叠窗口或多尺度表示。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 18
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 19
- misconception: 步幅卷积和扩张卷积都只是扩大感受野，所以可互换。
  correction: 步幅稀疏输出并降低分辨率；扩张稀疏核采样位置，二者的混叠与输出网格不同。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 58
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 59
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 60
- misconception: U-Net 与 ResNet 的 skip connection 融合方式相同。
  correction: U-Net 跨镜像尺度按通道拼接；ResNet 在块旁采用加性残差路径。
  citations:
  - source_id: mit-6.7960-f24-lecture-04-slides
    anchor:
      type: page
      value: 71
