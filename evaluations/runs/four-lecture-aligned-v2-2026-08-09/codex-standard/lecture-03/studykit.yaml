glossary:
- term: 普适函数逼近
  definition: 对目标函数类中的任意函数和给定误差，模型族中存在满足误差要求的模型。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 3
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 10
- term: kink
  definition: 分段线性函数梯度发生改变的位置。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 27
- term: 深度分离
  definition: 深网络紧凑表示的某类函数，浅网络需要指数更多单元才能表示。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 25
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 33
common_misconceptions:
- misconception: 普适逼近意味着网络一定能训练出来。
  correction: 它只回答存在性，不回答优化。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 4
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 34
- misconception: 三层足够意味着三层总是高效。
  correction: 该构造规模随维数指数增长。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 18
- misconception: 深度分离证明越深越易训练、泛化越好。
  correction: 材料明确说两者都不能推出。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 34
