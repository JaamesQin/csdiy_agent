core_concepts:
- id: K1
  term: 逼近、优化、泛化
  claim_type: source_summary
  explanation: 逼近问模型族中是否存在拟合函数，优化问能否找到它，泛化问未见数据上是否有效；本讲集中于逼近。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 4
- id: K2
  term: L-Lipschitz 条件
  claim_type: source_summary
  explanation: 函数输出变化的绝对值不超过输入变化的 L 倍；多维输入使用 RMS 范数。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 8
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 9
  formula:
    status: resolved
    latex: '|g(x+\\Delta x)-g(x)|\\le L|\\Delta x|'
    citation:
      source_id: mit-6.7960-f24-lecture-03-slides
      anchor:
        type: page
        value: 8
    warnings: []
- id: K3
  term: RMS 范数
  claim_type: source_summary
  explanation: RMS 范数等于各坐标平方平均的平方根，表示向量坐标的平均尺度。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 9
  formula:
    status: resolved
    latex: \\|x\\|_{\\mathrm{RMS}}=\\sqrt{\\frac1d\\sum_{i=1}^{d}x_i^2}
    citation:
      source_id: mit-6.7960-f24-lecture-03-slides
      anchor:
        type: page
        value: 9
    warnings: []
- id: K4
  term: 三层 ReLU 逼近定理
  claim_type: source_summary
  explanation: 单位 d 维超立方体上的任意 L-Lipschitz 函数，对任意 ε>0，存在规模为 4d(L/ε)^d 的三层 ReLU 网络，使积分
    L1 误差小于 2ε。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 10
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 18
  formula:
    status: resolved
    latex: N=4d(L/\\varepsilon)^d,\\quad\\int_{[0,1]^d}|f(x)-g(x)|\\,dx<2\\varepsilon
    citation:
      source_id: mit-6.7960-f24-lecture-03-slides
      anchor:
        type: page
        value: 10
    warnings: []
- id: K5
  term: 一维分片矩形误差
  claim_type: source_summary
  explanation: N 条等宽区间中，每条的最大偏差形成底 1/N、高 L/N 的三角形；总面积不超过 L/(2N)，故 N=L/(2ε) 足以达到 ε。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 12
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 13
  formula:
    status: resolved
    latex: \\int |f-g|\\le N\\cdot\\frac12\\frac1N\\frac LN=\\frac{L}{2N}
    citation:
      source_id: mit-6.7960-f24-lecture-03-slides
      anchor:
        type: page
        value: 13
    warnings: []
- id: K6
  term: 高维矩形逼近
  claim_type: source_summary
  explanation: N 个超矩形边长 N^{-1/d}，误差帽高度 L/N^{1/d}，合计误差不超过 L/N^{1/d}；达到 ε 需 N=(L/ε)^d。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 14
  formula:
    status: resolved
    latex: N=(L/\\varepsilon)^d
    citation:
      source_id: mit-6.7960-f24-lecture-03-slides
      anchor:
        type: page
        value: 14
    warnings: []
- id: K7
  term: 一维 ReLU 矩形
  claim_type: source_summary
  explanation: 四个带平移的 ReLU 按 +1,-1,-1,+1 线性组合，在 c→∞ 时逼近 [0,1] 的矩形指示；权重和偏置可平移矩形。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 15
  formula:
    status: resolved
    latex: f_c(x)=[1,-1,-1,1]^\\top\\operatorname{ReLU}([cx,cx-1,c(x-1)-2,c(x-1)-3]^\\top)
    citation:
      source_id: mit-6.7960-f24-lecture-03-slides
      anchor:
        type: page
        value: 15
    warnings: []
- id: K8
  term: 超矩形门与线性组合
  claim_type: source_summary
  explanation: 各坐标的一维矩形全部开启时，和才超过 d−1；在该阈值施加 ReLU 得到超矩形，再用带位置参数的超矩形线性组合逼近曲面。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 16
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 17
  formula:
    status: resolved
    latex: h_c(x)=\\operatorname{ReLU}(\\sum_{i=1}^{d}f_c(x_i)-(d-1)),\\quad f(x)=\\sum_i\\alpha_i
      h_c(x-u_i)
    citation:
      source_id: mit-6.7960-f24-lecture-03-slides
      anchor:
        type: page
        value: 17
    warnings: []
- id: K9
  term: 维数灾难与训练局限
  claim_type: source_summary
  explanation: 构造需要对维数指数增长的神经元；矩形表示若只落在训练点上并被权重衰减抑制其他部分，可能不泛化。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 18
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 19
- id: K10
  term: 普适逼近的非充分性
  claim_type: source_summary
  explanation: Fourier 级数、多项式和 Python 程序空间也具有广泛表达能力，但这不意味着通常用它们完成机器学习；普适逼近不足以保证学习成功。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 21
- id: K11
  term: ReLU 网络的分段线性性
  claim_type: source_summary
  explanation: ReLU 本身分段线性，分段线性函数对和、复合、标量乘法封闭，因此 ReLU 网络可用梯度改变处 kink 的数量分析。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 27
- id: K12
  term: kink 递推界
  claim_type: source_summary
  explanation: 宽度 n 的线性组合至多累加 kinks，ReLU 至多将线性片段一分为二，所以 KINKS_l≤2n KINKS_{l−1}，从 KINKS_0=1
    得 KINKS_L≤(2n)^L。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 28
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 29
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 30
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 31
  formula:
    status: resolved
    latex: \\mathrm{KINKS}_L\\le2n\\,\\mathrm{KINKS}_{L-1}\\le(2n)^L
    citation:
      source_id: mit-6.7960-f24-lecture-03-slides
      anchor:
        type: page
        value: 30
    warnings: []
- id: K13
  term: 三角形函数复合
  claim_type: source_summary
  explanation: 宽度 2 的三角形 ReLU 函数每次与自身复合使线性区域数翻倍。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 32
  formula:
    status: resolved
    latex: g(x)=\\operatorname{ReLU}(2\\operatorname{ReLU}(x)-4\\operatorname{ReLU}(x-\\tfrac12))
    citation:
      source_id: mit-6.7960-f24-lecture-03-slides
      anchor:
        type: page
        value: 32
    warnings: []
- id: K14
  term: 深度分离数值例
  claim_type: source_summary
  explanation: g 自复合 500 次有 2^500−1 个 kinks，以 1000 层、宽度 2 表示；若换成三层网络，匹配该 kink 数需约
    7×10^49 宽度。
  citations:
  - source_id: mit-6.7960-f24-lecture-03-slides
    anchor:
      type: page
      value: 33
  formula:
    status: resolved
    latex: n\\ge\\tfrac12(2^{500}-1)^{1/3}\\approx7\\times10^{49}
    citation:
      source_id: mit-6.7960-f24-lecture-03-slides
      anchor:
        type: page
        value: 33
    warnings: []
- id: K15
  term: 逼近结论的实践边界
  claim_type: source_summary
  explanation: 深度分离不意味着深网络容易训练或泛化良好；寻找实际最优宽深比还会受学习率等训练管线混杂因素影响。
