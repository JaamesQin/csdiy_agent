core_concepts:
- id: K1
  term: Transformer 的动机
  claim_type: source_summary
  explanation: 小核 CNN 依赖逐层扩大的感受野；浅层网络中相距很远的 patch 可能没有共同接收二者的节点。Transformer 用 attention
    在 token 间混合信息。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 4
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 5
- id: K2
  term: Token
  claim_type: source_summary
  explanation: 本讲把 token 视为一组神经元形成的向量，是模型各层访问和修改信息的基本单位。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 11
- id: K3
  term: 图像 tokenization
  claim_type: source_summary
  explanation: 把图像裁成 patches，向量化后经可学习线性投影得到 d 维 tokens；N 个 token 作为 T 的 N 行。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 14
  formula:
    status: resolved
    latex: t\in\mathbb{R}^{d},\qquad T\in\mathbb{R}^{N\times d}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 14
    warnings: []
- id: K4
  term: 跨 token 线性组合
  claim_type: source_summary
  explanation: 标量权重作用于整条 token 向量，因而左乘 W 改变 token 轴而保留代码维度。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 17
  formula:
    status: resolved
    latex: T_{out}[i,:]=\sum_{j=1}^{N}w_{ij}T_{in}[j,:],\qquad T_{out}=WT_{in}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 17
    warnings: []
- id: K5
  term: Token-wise nonlinearity
  claim_type: source_summary
  explanation: 共享函数 F_θ 分别变换每一行，不与其他 token 通信；通常 F_θ 是 MLP。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 18
  formula:
    status: resolved
    latex: T_{out}=\begin{bmatrix}F_\theta(T_{in}[0,:])\\\vdots\\F_\theta(T_{in}[N-1,:])\end{bmatrix}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 18
    warnings: []
- id: K6
  term: Token net 与图视角
  claim_type: source_summary
  explanation: token net 交替执行节点混合与逐节点更新；课件把 GNN 的 AGGREGATE/UPDATE 对应到这两步，并把 Transformer
    看作完全图上的 GNN。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 20
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 23
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 24
- id: K7
  term: 数据依赖注意力矩阵
  claim_type: source_summary
  explanation: 普通线性层的 W 是自由参数，而注意力矩阵 A 由输入数据经过函数 f 构造，因此是动态加权汇聚。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 20
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 32
- id: K8
  term: QKV self-attention
  claim_type: source_summary
  explanation: 每个输入 token 投影出 query、key、value；每个 query 与所有 keys 匹配，归一化权重随后混合 values，产生相同数量的输出
    tokens。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 29
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 30
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
  formula:
    status: resolved
    latex: Q=T_{in}W_q^T,\;K=T_{in}W_k^T,\;V=T_{in}W_v^T,\quad A=\operatorname{softmax}\left(\frac{QK^T}{\sqrt
      m}\right),\quad T_{out}=AV
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 34
    warnings:
    - softmax 轴取决于行/列约定；此处保留课件矩阵关系，不指定实现 API 的轴。
- id: K9
  term: Multihead self-attention
  claim_type: source_summary
  explanation: k 个 head 使用各自的 Q/K/V 函数并行产生表示，按 token 对齐拼接成 N×kv，再由 W_MSA 投影至 d 维。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 37
  formula:
    status: resolved
    latex: T_{out}^{i}=\operatorname{attn}^{i}(T_{in}),\quad \bar T_{out}\in\mathbb{R}^{N\times
      kv},\quad T_{out}=\bar T_{out}W_{MSA},\;W_{MSA}\in\mathbb{R}^{kv\times d}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 37
    warnings: []
- id: K10
  term: ViT block
  claim_type: source_summary
  explanation: 一个块采用 token norm→MSA→残差，再 token norm→逐 token MLP→残差；灰色块重复 L 次。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 38
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 39
- id: K11
  term: Permutation equivariance
  claim_type: source_summary
  explanation: 若输入 token 行被置换，token-wise 层和 attention 的输出行随之作同一置换；组合后的 transformer
    仍保持该性质。等变不是输出不变。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 35
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 41
  formula:
    status: resolved
    latex: \operatorname{transformer}(\operatorname{permute}(T_{in}))=\operatorname{permute}(\operatorname{transformer}(T_{in}))
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 41
    warnings: []
- id: K12
  term: Fourier positional encoding
  claim_type: source_summary
  explanation: 为每个图像 token 编码 x、y 坐标在一组不同尺度正弦波上的取值，再把位置代码附加到 token 表示；第44页正文给出的方式是拼接，从而使位置可区分。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 43
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 44
  formula:
    status: resolved
    latex: p_x=[\sin(x),\sin(x/B),\sin(x/B^2),\ldots,\sin(x/B^P)]^T,\quad p_y=[\sin(y),\sin(y/B),\ldots,\sin(y/B^P)]^T,\quad
      p=[p_x;p_y]
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 44
    warnings:
    - 严格按第44页可见 sine 公式转录。
- id: K13
  term: Causal attention
  claim_type: source_summary
  explanation: causal mask 令某位置只能依赖允许的过去位置；同一次矩阵计算可监督多个 next-token 目标，多层连接仍保持因果路径。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 48
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 52
- id: K14
  term: Cross-attention
  claim_type: source_summary
  explanation: 在图像到文本架构中，文本 token 发出 queries，图像 tokens 提供 keys/values；文本解码器本身同时使用
    causal self-attention。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 54
glossary:
- term: code vector
  definition: 一个 token 内部的神经元向量。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 11
- term: attention matrix
  definition: 由输入相关匹配构造、用于混合 values 的权重矩阵。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 20
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
- term: head
  definition: 具有独立 Q/K/V 参数的一路注意力计算。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 37
- term: token norm
  definition: 逐 token 的归一化操作。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 38
- term: causal mask
  definition: 屏蔽会让当前位置获取未来信息的注意力连接。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 52
- term: cross-attention
  definition: queries 与 keys/values 来自不同 token 集合的注意力。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 54
common_misconceptions:
- misconception: token mixing 等同于普通全连接层在通道上的变换。
  correction: 本讲的 W 左乘 token 矩阵，混合的是行所代表的 tokens。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 17
- misconception: attention 权重就是训练后固定的参数 W。
  correction: A 由当前数据动态构造。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 20
- misconception: 置换等变意味着输出完全不变。
  correction: 输出按输入的相同置换重新排列。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 41
- misconception: 多头注意力让每个 head 共享同一 Q/K/V 参数。
  correction: 每个 head 有自己的参数化 Q/K/V 函数。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 37
- misconception: 自回归训练必须按位置串行运行。
  correction: causal mask 允许一次前向过程同时产生多个位置的监督预测。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
