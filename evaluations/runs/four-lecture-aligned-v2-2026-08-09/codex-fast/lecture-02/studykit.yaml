practice:
- id: p1
  level: 基础
  question: 比较 batch=1、一般小批量与 batch=N 时一次更新使用的数据。
  hint: 从第 9 页的两个边界情形开始。
  deliverable: 三行比较表。
  expected_evidence:
  - 两个边界正确
  - 说明小批量是总梯度的近似
  evaluation:
    criteria:
    - 概念准确
    - 表达简洁
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 9
- id: p2
  level: 基础
  question: 为第 29 页计算图列出一次训练迭代的 forward、backward、update 顺序。
  hint: 先得到标量损失，再逆序传播。
  deliverable: 有向流程图。
  expected_evidence:
  - 前向按依赖顺序
  - 反向从损失开始
  - 参数最后更新
  evaluation:
    criteria:
    - 顺序完整
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 29
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 42
- id: p3
  level: 进阶
  question: 若 x、u、z 的长度分别为 n、p、m，写出链式法则中两个 Jacobian 及乘积的形状。
  hint: 参考第 34 页标注。
  deliverable: 三项形状推导。
  expected_evidence:
  - m×p
  - p×n
  - 结果 m×n
  evaluation:
    criteria:
    - 维度与顺序都正确
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 34
- id: p4
  level: 进阶
  question: 对 x_out=W x_in 画出输入梯度与权重梯度所需的局部量并标形状。
  hint: 沿用讲义的行向量 g 约定。
  deliverable: 局部反向传播卡片。
  expected_evidence:
  - g_in=g_out W
  - 权重梯度由输入与输出梯度组合
  - 形状一致
  evaluation:
    criteria:
    - 公式和形状匹配
  citations:
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 46
  - source_id: mit-6.7960-f24-lecture-02-slides
    anchor:
      type: page
      value: 48
- id: p5
