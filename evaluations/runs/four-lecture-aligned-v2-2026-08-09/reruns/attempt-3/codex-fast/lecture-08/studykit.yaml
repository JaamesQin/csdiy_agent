practice:
- id: p1
  level: 基础
  question: 将 5 个 patches 投影成 12 维 tokens。写出 T 的形状；若 W∈R^{3×5}，写出 WT 的形状并解释每个输出行。
  hint: tokens 是行。
  deliverable: 形状和一句解释。
  expected_evidence:
  - T为5×12
  - WT为3×12
  - 输出行是输入token的加权和
  evaluation:
    criteria:
    - 形状
    - 语义
    points: 4
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
