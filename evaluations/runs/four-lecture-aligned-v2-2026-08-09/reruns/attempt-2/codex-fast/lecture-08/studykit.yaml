core_concepts:
- id: K1
  term: 局部性限制
  claim_type: source_summary
  explanation: 小卷积核只连接局部邻域；浅层示例中相距很远的输入节点无法共同影响一个节点。attention 用跨 token 混合来处理此类关系。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 4
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 5
- id: K2
  term: Tokenization
  claim_type: source_summary
  explanation: token 是封装信息的向量。图像可切成 patches，每个 patch 经线性投影成为 d 维 token，N 个 tokens
    作为矩阵 T 的行。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 14
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 14
  formula:
    status: resolved
    latex: t\in\mathbb{R}^{d},\qquad T\in\mathbb{R}^{N\times d}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 14
    warnings: []
- id: K3
  term: Token mixing
  claim_type: source_summary
  explanation: 标量权重作用于整条 token 向量；左乘 W 对 token 行作线性组合。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 17
  formula:
    status: resolved
    latex: T_{out}[i,:]=\sum_{j=1}^{N}w_{ij}T_{in}[j,:],\qquad T_{out}=WT_{in}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 17
    warnings: []
- id: K4
  term: Token-wise nonlinearity
  claim_type: source_summary
  explanation: 同一 F_θ 独立作用于各 token；通常 F_θ 是 MLP，此步本身不跨 token 汇聚。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 18
  formula:
    status: resolved
    latex: T_{out}=\begin{bmatrix}F_\theta(T_{in}[0,:])\\\vdots\\F_\theta(T_{in}[N-1,:])\end{bmatrix}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 18
    warnings: []
- id: K5
  term: 数据依赖 attention
  claim_type: source_summary
  explanation: 普通线性层直接学习 W；attention 则由输入构造 A，使混合权重随当前 tokens 改变。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 20
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
- id: K6
  term: Scaled dot-product self-attention
  claim_type: source_summary
  explanation: 同一输入集产生 Q、K、V；QK^T 给出所有 query-key 匹配，经缩放和 softmax 得 A，随后 AV 汇聚 values。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 30
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
  formula:
    status: resolved
    latex: Q=T_{in}W_q^T,\;K=T_{in}W_k^T,\;V=T_{in}W_v^T,\quad A=\operatorname{softmax}\left(\frac{QK^T}{\sqrt
      m}\right),\quad T_{out}=AV
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 34
    warnings:
    - softmax 轴随行列约定而定；这里保留课件矩阵关系。
- id: K7
  term: Multihead self-attention
  claim_type: source_summary
  explanation: k 个 heads 分别计算 attention，按 token 行拼接为 N×kv，再用 W_MSA 投影回 d 维。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 37
  formula:
    status: resolved
    latex: T_{out}^{i}=\operatorname{attn}^{i}(T_{in}),\quad \bar T_{out}\in\mathbb{R}^{N\times
      kv},\quad T_{out}=\bar T_{out}W_{MSA},\;W_{MSA}\in\mathbb{R}^{kv\times d}
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 37
    warnings: []
- id: K8
  term: ViT block
  claim_type: source_summary
  explanation: 课件展示的块依次使用 token norm、MSA、残差，再使用 token norm、逐 token MLP、残差，并重复 L 次。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 39
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 39
- id: K9
  term: Permutation equivariance
  claim_type: source_summary
  explanation: 输入 token 行被置换时，输出行作相同置换；这不是逐项输出不变。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 41
  formula:
    status: resolved
    latex: \operatorname{transformer}(\operatorname{permute}(T_{in}))=\operatorname{permute}(\operatorname{transformer}(T_{in}))
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 41
    warnings: []
- id: K10
  term: Fourier positional codes
  claim_type: source_summary
  explanation: 把 x、y 坐标在多尺度正弦上的值组织成位置向量并附加到 token 表示，使空间位置可区分。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 43
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 43
  formula:
    status: resolved
    latex: p_x=[\sin(x),\sin(x/B),\sin(x/B^2),\ldots]^T,\quad p_y=[\sin(y),\sin(y/B),\sin(y/B^2),\ldots]^T,\quad
      p=[p_x;p_y]
    citation:
      source_id: mit-6.7960-f24-lecture-08-slides
      anchor:
        type: page
        value: 43
    warnings:
    - 只转录第44页可见的 sine 分量。
- id: K11
  term: Causal attention
  claim_type: source_summary
  explanation: causal mask 阻止当前位置依赖未来 tokens；一次前向仍能并行监督多个 next-token 位置，多层连接保持因果。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
- id: K12
  term: Cross-attention
  claim_type: source_summary
  explanation: 图像到文本架构用 image self-attention 编码视觉 tokens；文本侧用 causal self-attention，并让文本
    queries 对图像 keys/values 做 cross-attention。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 54
glossary:
- term: query
  definition: 表达当前 token 要匹配的信息。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
- term: key
  definition: 与 query 计算匹配的表示。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
- term: value
  definition: 被 attention 权重汇聚的内容。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
- term: head
  definition: 一套独立 Q/K/V 参数的 attention 路径。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 37
- term: causal mask
  definition: 遮住通向未来 token 的连接。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
- term: cross-attention
  definition: Q 与 K/V 来自不同 token 集。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 54
common_misconceptions:
- misconception: token 是标量。
  correction: 本讲 token 是神经元向量。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 14
- misconception: A 是输入无关的自由参数。
  correction: A 由输入相关的 Q/K 匹配产生。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 20
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 34
- misconception: 等变等于不变。
  correction: 输出随输入作相同置换。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 41
- misconception: causal 训练必须逐位置串行。
  correction: mask 允许一次前向监督多个位置。
  citations:
  - source_id: mit-6.7960-f24-lecture-08-slides
    anchor:
      type: page
      value: 51
